<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nhạc nền</title>
<style>
  /* Nguồn nhạc riêng cho OBS / LIVE Studio (bật âm thanh cho nguồn). Nền trong suốt. */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #np {
    position: fixed; left: 16px; bottom: 16px; max-width: calc(100vw - 32px);
    padding: 8px 18px; border-radius: 999px; background: rgba(17, 24, 39, .85); color: #fde68a;
    font: 700 22px/1.3 "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity .5s;
  }
  #np.show { opacity: 1; }
</style>
</head>
<body>
<div id="np"></div>
<script type="module">
  import { connectWS } from '/ws-client.js';
  import { createMusicPlayer } from '/music-player.js';
  const np = document.getElementById('np');
  let player;
  const server = connectWS((msg) => player?.handle(msg));
  player = createMusicPlayer(server, {
    onTrack: (track, playing) => {
      np.textContent = track ? `🎵 ${track.name}` : '';
      np.classList.toggle('show', Boolean(track && playing));
    },
  });
</script>
</body>
</html>
