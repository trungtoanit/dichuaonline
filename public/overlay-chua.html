<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay chùa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@500;700&family=Be+Vietnam+Pro:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* Thiết kế cho khung dọc 1080×1920, tự co giãn theo kích thước nguồn trong OBS.
     Mặc định phần giữa trong suốt để thấy camera; thêm ?nen để có cảnh chánh điện đầy đủ làm nền.
     Phong cách trang nghiêm, tối giản: vàng đồng, nâu trầm, kem sáng, xanh ngọc trầm. */
  :root {
    --font: 30px;
    --gold: #c6a15b;
    --gold-light: #e8c77e;
    --brown: #38291f;
    --brown-dark: #231b17;
    --cream: #f8f2e7;
    --jade: #436c60;
    --ink: #38291f;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif; }
  body.preview { background: repeating-conic-gradient(#1e293b 0 25%, #172033 0 50%) 0 0 / 32px 32px; }

  #stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1080px;
    height: 1920px;
    transform-origin: 0 0;
    overflow: hidden;
  }
  #stage > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #scene, #motes { display: none; }
  body.nen #scene, body.nen #motes { display: block; }

  /* Chuyển động nhẹ, không nhấp nháy */
  .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flame 2.4s ease-in-out infinite alternate; }
  .flame.b { animation-delay: -1.2s; }
  @keyframes flame { from { transform: scale(1, 1) rotate(-2deg); } to { transform: scale(.92, 1.08) rotate(2deg); } }
  .halo { transform-box: fill-box; transform-origin: center; animation: breathe 7s ease-in-out infinite alternate; }
  @keyframes breathe { from { opacity: .75; transform: scale(.98); } to { opacity: 1; transform: scale(1.02); } }
  .rays { transform-box: fill-box; transform-origin: center; animation: turn 120s linear infinite; }
  @keyframes turn { to { transform: rotate(360deg); } }
  .smoke { animation: rise 7s ease-out infinite; opacity: 0; }
  .smoke.b { animation-delay: -2.3s; }
  .smoke.c { animation-delay: -4.6s; }
  @keyframes rise {
    0% { opacity: 0; transform: translateY(0) scale(.6); }
    25% { opacity: .45; }
    100% { opacity: 0; transform: translateY(-240px) scale(1.7); }
  }

  /* Bụi sáng vàng bay lên chậm */
  #motes { position: absolute; inset: 0; pointer-events: none; }
  #motes i {
    position: absolute; bottom: 560px; width: 8px; height: 8px; border-radius: 50%;
    background: radial-gradient(circle, #fff3cf 0, #e8c77e 45%, rgba(232, 199, 126, 0) 70%);
    opacity: 0; animation: mote linear infinite;
  }
  @keyframes mote {
    0% { opacity: 0; transform: translate(0, 0); }
    15% { opacity: .85; }
    85% { opacity: .6; }
    100% { opacity: 0; transform: translate(var(--dx), -900px); }
  }

  /* Đầu trang: logo hoa sen + tên */
  #header {
    position: absolute; left: 0; right: 0; top: 0; height: 176px;
    display: flex; align-items: center; justify-content: center; gap: 22px;
    background: linear-gradient(180deg, #231b17, #38291f);
    border-bottom: 4px solid var(--gold);
    box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
  }
  #header::after { /* viền chỉ vàng mảnh */
    content: ""; position: absolute; left: 80px; right: 80px; bottom: 10px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold-light), transparent);
  }
  #header svg { width: 96px; height: 96px; }
  #header .name { text-align: center; }
  #header h1 {
    margin: 0; font: 700 56px/1.1 "Noto Serif", serif; letter-spacing: 6px;
    background: linear-gradient(180deg, #f6e2b0, #c6a15b 70%, #9c7a3c);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #header p { margin: 6px 0 0; font: 500 26px/1.2 "Noto Serif", serif; letter-spacing: 8px; color: var(--cream); opacity: .85; }

  /* Câu đối trên cột */
  .couplet {
    position: absolute;
    top: 470px;
    width: 64px;
    writing-mode: vertical-rl;
    text-orientation: upright;
    font: 700 32px/64px "Noto Serif", serif;
    letter-spacing: 8px;
    color: var(--gold-light);
    text-align: center;
    text-shadow: 0 2px 3px rgba(0, 0, 0, .6);
  }
  .couplet.l { left: 0; }
  .couplet.r { right: 0; }

  /* Số Phật tử đang dự */
  #count {
    position: absolute;
    left: 50%;
    top: 196px;
    transform: translateX(-50%);
    padding: 6px 26px;
    border-radius: 999px;
    background: rgba(35, 27, 23, .82);
    border: 2px solid var(--gold);
    color: var(--gold-light);
    font: 700 24px/1.3 "Noto Serif", serif;
    white-space: nowrap;
  }

  /* Thông báo Phật tử mới vào */
  #welcome {
    position: absolute;
    left: 50%;
    top: 262px;
    transform: translateX(-50%);
    padding: 12px 34px;
    border-radius: 999px;
    background: rgba(248, 242, 231, .96);
    border: 2px solid var(--gold);
    color: var(--ink);
    font: 600 26px/1.3 "Be Vietnam Pro", sans-serif;
    white-space: nowrap;
    max-width: 760px;
    overflow: hidden;
    text-overflow: ellipsis;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .3);
    opacity: 0;
    transition: opacity .6s, transform .6s;
  }
  #welcome.show { opacity: 1; transform: translateX(-50%) translateY(6px); }

  /* Thành tâm tri ân: hoa sen vàng nở, tên người tặng quà, lời chúc */
  #thanks {
    position: absolute; left: 50%; top: 1010px; width: 720px; /* dưới tượng Phật, không che dung nhan */
    transform: translateX(-50%) translateY(16px); opacity: 0;
    padding: 26px 36px 30px; border-radius: 28px; text-align: center;
    background: radial-gradient(120% 90% at 50% 0%, #4a3728 0%, #2b211b 55%, #231b17 100%);
    border: 2px solid var(--gold);
    box-shadow: 0 0 0 8px rgba(198, 161, 91, .15), 0 18px 48px rgba(0, 0, 0, .5);
    transition: opacity .8s ease, transform .8s ease;
    z-index: 6000;
  }
  #thanks.show { opacity: 1; transform: translateX(-50%); }
  #thanks svg { width: 170px; height: 120px; display: block; margin: 0 auto 6px; overflow: visible; }
  #thanks .petal { transform-box: fill-box; transform-origin: 50% 100%; transform: scale(.2); opacity: 0; transition: transform 1.2s cubic-bezier(.2, .8, .2, 1), opacity 1s; }
  #thanks.show .petal { transform: none; opacity: 1; }
  #thanks.show .petal.p2 { transition-delay: .15s; }
  #thanks.show .petal.p3 { transition-delay: .3s; }
  #thanks .t1 { font: 700 40px/1.2 "Noto Serif", serif; color: var(--gold-light); }
  #thanks .t2 { margin-top: 10px; font: 700 46px/1.2 "Noto Serif", serif; color: #fff; overflow-wrap: anywhere; }
  #thanks .t3 { margin-top: 12px; font: 500 28px/1.4 "Be Vietnam Pro", sans-serif; color: #e7d8b9; }
  #thanks .t4 { margin-top: 4px; font: 500 24px/1.4 "Be Vietnam Pro", sans-serif; color: #e7d8b9; opacity: .85; }

  /* Phật tử trong chánh điện: avatar làm đầu, áo tràng có tay, chân đi giày; đi lại, lên quỳ lạy trước bàn thờ */
  .pt {
    position: absolute;
    left: 0;
    top: 0;
    width: 150px;
    display: flex;
    flex-direction: column;
    align-items: center;
    transform-origin: 50% 100%;
    animation: arrive .8s ease-out both;
  }
  .pt.leaving { animation: depart .6s ease-in both; }
  @keyframes arrive { from { opacity: 0; translate: 0 30px; } }
  @keyframes depart { to { opacity: 0; translate: 0 20px; } }
  .pt .fig { display: flex; flex-direction: column; align-items: center; }
  /* Vật phẩm donate trên đầu (bay lên bàn thờ khi dâng lễ) */
  .pt .item { position: relative; display: flex; justify-content: center; align-items: flex-end; margin-bottom: 6px; }
  .pt .item:empty { display: none; }
  .pt .item svg { width: 70px; height: 70px; filter: drop-shadow(0 0 10px rgba(255, 220, 140, .85)); }
  .pt .item .emo { font-size: 58px; line-height: 1; filter: drop-shadow(0 0 10px rgba(255, 220, 140, .85)); }
  .pt .item .x {
    position: absolute; right: -14px; bottom: -2px; padding: 0 7px; border-radius: 999px;
    background: var(--gold); color: var(--brown-dark); font: 700 18px/1.4 "Be Vietnam Pro", sans-serif;
  }
  .pt .item { animation: float 2.4s ease-in-out infinite alternate; }
  @keyframes float { to { transform: translateY(-6px); } }
  .pt .item.offer { animation: offer 1.6s ease-in forwards; }
  @keyframes offer { 0% { transform: none; opacity: 1; } 100% { transform: translateY(-220px) scale(.5); opacity: 0; } }
  .pt .head {
    width: 72px; height: 72px; border-radius: 50%;
    object-fit: cover;
    border: 4px solid var(--cream);
    background: #8c6a4a; color: #fff;
    display: grid; place-items: center;
    font: 600 30px/1 "Be Vietnam Pro", sans-serif;
    position: relative; z-index: 3;
    box-shadow: 0 4px 10px rgba(0, 0, 0, .35);
  }
  .pt .torso { position: relative; width: 112px; height: 96px; margin-top: -10px; z-index: 2; transform-origin: 50% 100%; transition: height .5s; }
  .pt .robe {
    position: absolute; left: 10px; top: 0; width: 92px; height: 100%;
    background: linear-gradient(180deg, #7b6a5a, #5a4a3d);
    border-radius: 42px 42px 16px 16px;
    box-shadow: 0 6px 12px rgba(0, 0, 0, .35);
  }
  .pt .robe::before { /* cổ áo chéo */
    content: ""; position: absolute; left: 50%; top: 6px; width: 32px; height: 32px;
    border-left: 4px solid #3f332a; border-bottom: 4px solid #3f332a;
    transform: translateX(-50%) rotate(-45deg); border-radius: 0 0 0 6px;
  }
  /* Tay áo + bàn tay; đứng yên / quỳ thì chắp tay trước ngực */
  .pt .arm {
    position: absolute; top: 12px; width: 22px; height: 60px; border-radius: 11px; z-index: 1;
    background: linear-gradient(180deg, #6e5e4f, #54463a);
    transform-origin: 50% 10px; transition: transform .4s;
  }
  .pt .arm::after { content: ""; position: absolute; left: 2px; bottom: -8px; width: 18px; height: 18px; border-radius: 50%; background: #e9bf95; }
  .pt .arm.l { left: 2px; transform: rotate(-48deg); }
  .pt .arm.r { right: 2px; transform: rotate(48deg); }
  /* Chân + giày */
  .pt .legs { position: relative; width: 60px; height: 46px; margin-top: -16px; z-index: 1; transition: height .5s; }
  .pt .leg { position: absolute; top: 0; width: 20px; height: 100%; border-radius: 8px; background: #3a2f27; transform-origin: 50% 0; }
  .pt .leg::after { content: ""; position: absolute; bottom: -6px; left: -3px; width: 26px; height: 12px; border-radius: 10px 10px 4px 4px; background: #1b1410; }
  .pt .leg.l { left: 6px; }
  .pt .leg.r { right: 6px; }
  .pt .nm {
    margin-top: 10px; max-width: 160px;
    padding: 2px 10px; border-radius: 999px;
    background: rgba(35, 27, 23, .85); color: var(--cream);
    border: 1px solid rgba(198, 161, 91, .6);
    font: 600 19px/1.3 "Be Vietnam Pro", sans-serif;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pt.speaking .head { border-color: var(--gold-light); box-shadow: 0 0 0 6px rgba(232, 199, 126, .4), 0 4px 10px rgba(0, 0, 0, .35); }
  .pt.speaking:not(.walking):not(.kneel) .torso { animation: bob .9s ease-in-out infinite alternate; }
  @keyframes bob { to { transform: translateY(-4px); } }
  /* Bước đi: chân bước, tay vung ngược chân, người nhún nhẹ */
  .pt.walking .fig { animation: stepBob .3s ease-in-out infinite alternate; }
  .pt.walking .leg.l, .pt.walking .arm.r { animation: swingA .6s ease-in-out infinite alternate; }
  .pt.walking .leg.r, .pt.walking .arm.l { animation: swingB .6s ease-in-out infinite alternate; }
  @keyframes stepBob { from { transform: translateY(0); } to { transform: translateY(-5px); } }
  @keyframes swingA { from { transform: rotate(20deg); } to { transform: rotate(-20deg); } }
  @keyframes swingB { from { transform: rotate(-20deg); } to { transform: rotate(20deg); } }
  /* Đứng chắp tay vái */
  .pt.bowing .head { animation: bow 2.4s ease-in-out infinite; }
  @keyframes bow { 0%, 100% { transform: none; } 40%, 60% { transform: translateY(10px) scale(.96); } }
  /* Quỳ: chân gập dưới áo, người thấp xuống; lạy: cúi đầu sát xuống rồi ngẩng lên */
  .pt.kneel .legs { height: 12px; }
  .pt.kneel .leg::after { display: none; }
  .pt.kneel .torso { height: 82px; }
  .pt.kneel .robe { left: 4px; width: 104px; border-radius: 42px 42px 26px 26px; }
  .pt.kneel.lay .head { animation: layHead 3.2s ease-in-out infinite; }
  .pt.kneel.lay .torso { animation: layBody 3.2s ease-in-out infinite; }
  @keyframes layHead { 0%, 20%, 100% { transform: none; } 45%, 65% { transform: translateY(52px) scale(.9); } }
  @keyframes layBody { 0%, 20%, 100% { transform: none; } 45%, 65% { transform: scaleY(.72); } }

  /* Bong bóng bình luận trên đầu */
  .bubble {
    position: absolute;
    bottom: calc(100% + 14px);
    left: 50%;
    transform: translateX(-50%);
    width: max-content;
    max-width: 420px;
    padding: 12px 18px;
    border-radius: 18px;
    background: var(--cream);
    border: 3px solid var(--gold);
    color: var(--ink);
    font: 500 var(--font)/1.3 "Be Vietnam Pro", sans-serif;
    overflow-wrap: anywhere;
    box-shadow: 0 8px 22px rgba(0, 0, 0, .4);
    animation: pop .4s cubic-bezier(.2, .9, .3, 1.2) both;
  }
  .bubble::after { /* đuôi bong bóng */
    content: ""; position: absolute; top: 100%; left: 50%;
    border: 14px solid transparent; border-top-color: var(--gold);
    transform: translateX(-50%);
  }
  .edge-l .bubble { left: 0; transform: none; }
  .edge-l .bubble::after { left: 60px; }
  .edge-r .bubble { left: auto; right: 0; transform: none; }
  .edge-r .bubble::after { left: auto; right: 46px; transform: none; }
  .bubble.leaving { animation: unpop .3s ease-in both; }
  @keyframes pop { from { opacity: 0; scale: .7; } }
  @keyframes unpop { to { opacity: 0; scale: .85; } }
</style>
</head>
<body>
<div id="stage">
  <!-- Cảnh chánh điện đầy đủ (chỉ hiện khi có ?nen) -->
  <svg id="scene" viewBox="0 0 1080 1920" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1c1511"/>
        <stop offset=".6" stop-color="#2d221b"/>
        <stop offset="1" stop-color="#38291f"/>
      </linearGradient>
      <radialGradient id="glowBack" cx=".5" cy=".42" r=".5">
        <stop offset="0" stop-color="#f3d58f" stop-opacity=".55"/>
        <stop offset=".45" stop-color="#c6a15b" stop-opacity=".22"/>
        <stop offset="1" stop-color="#c6a15b" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="goldBody" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f6e2b0"/>
        <stop offset=".45" stop-color="#d9b46a"/>
        <stop offset="1" stop-color="#9c7a3c"/>
      </linearGradient>
      <linearGradient id="goldEdge" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#f1d79a"/>
        <stop offset="1" stop-color="#a7843f"/>
      </linearGradient>
      <radialGradient id="haloFill" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#fff4d2" stop-opacity=".95"/>
        <stop offset=".55" stop-color="#e8c77e" stop-opacity=".55"/>
        <stop offset="1" stop-color="#c6a15b" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#5a4130"/>
        <stop offset="1" stop-color="#2f2219"/>
      </linearGradient>
      <linearGradient id="jadeCloth" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#2f4f46"/>
        <stop offset=".5" stop-color="#436c60"/>
        <stop offset="1" stop-color="#2f4f46"/>
      </linearGradient>
      <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3b2c22"/>
        <stop offset="1" stop-color="#1d1611"/>
      </linearGradient>
      <radialGradient id="floorGlow" cx=".5" cy="0" r=".7">
        <stop offset="0" stop-color="#e8c77e" stop-opacity=".28"/>
        <stop offset="1" stop-color="#e8c77e" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="candleGlow" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#ffd98a" stop-opacity=".6"/>
        <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
      </radialGradient>
      <!-- Cánh sen (dùng cho tòa sen và bình sen) -->
      <path id="petal" d="M0 0 C-22 -18 -22 -58 0 -80 C22 -58 22 -18 0 0Z"/>
      <g id="lotusFlower">
        <use href="#petal" fill="#f3c6cf" transform="rotate(-50) scale(.8)"/>
        <use href="#petal" fill="#f3c6cf" transform="rotate(50) scale(.8)"/>
        <use href="#petal" fill="#efb2bf" transform="rotate(-25) scale(.92)"/>
        <use href="#petal" fill="#efb2bf" transform="rotate(25) scale(.92)"/>
        <use href="#petal" fill="#f8d9de"/>
      </g>
      <g id="candle">
        <ellipse cx="0" cy="-70" rx="60" ry="60" fill="url(#candleGlow)"/>
        <path class="flame" d="M0 -96 C10 -80 10 -66 0 -60 C-10 -66 -10 -80 0 -96Z" fill="#ffcf6b"/>
        <path d="M0 -84 C4 -76 4 -68 0 -64 C-4 -68 -4 -76 0 -84Z" fill="#fff4d2"/>
        <rect x="-11" y="-60" width="22" height="70" rx="4" fill="#f8f2e7"/>
        <rect x="-11" y="-60" width="7" height="70" fill="#e7d8b9"/>
      </g>
    </defs>

    <!-- Tường chánh điện, vách gỗ -->
    <rect width="1080" height="1920" fill="url(#wall)"/>
    <g stroke="#4a372a" stroke-width="3" opacity=".55">
      <path d="M160 176 V1300 M280 176 V1300 M800 176 V1300 M920 176 V1300"/>
    </g>
    <!-- Khám thờ hình vòm -->
    <path d="M270 1180 V560 Q270 330 540 300 Q810 330 810 560 V1180Z" fill="#1a130f"/>
    <path d="M270 1180 V560 Q270 330 540 300 Q810 330 810 560 V1180" fill="none" stroke="url(#goldEdge)" stroke-width="8"/>
    <path d="M296 1180 V566 Q296 356 540 328 Q784 356 784 566 V1180" fill="none" stroke="#c6a15b" stroke-width="2" opacity=".6"/>
    <ellipse cx="540" cy="700" rx="520" ry="560" fill="url(#glowBack)"/>

    <!-- Hào quang -->
    <g class="rays" opacity=".45">
      <g stroke="#e8c77e" stroke-width="3">
        <path d="M540 620 L540 360 M540 620 L540 880 M540 620 L280 620 M540 620 L800 620 M540 620 L356 436 M540 620 L724 804 M540 620 L724 436 M540 620 L356 804"/>
        <path d="M540 620 L440 380 M540 620 L640 860 M540 620 L300 520 M540 620 L780 720 M540 620 L640 380 M540 620 L440 860 M540 620 L780 520 M540 620 L300 720" opacity=".6"/>
      </g>
    </g>
    <circle class="halo" cx="540" cy="620" r="200" fill="url(#haloFill)"/>
    <circle cx="540" cy="620" r="168" fill="none" stroke="#e8c77e" stroke-width="4" opacity=".8"/>
    <circle cx="540" cy="620" r="150" fill="none" stroke="#e8c77e" stroke-width="2" opacity=".5"/>

    <!-- Tượng Phật ngồi thiền (cách điệu) -->
    <g>
      <!-- thân, y áo -->
      <path d="M430 760 Q540 700 650 760 L700 960 Q540 1000 380 960Z" fill="url(#goldBody)"/>
      <path d="M470 740 Q520 820 500 960 M610 740 Q600 840 640 960" stroke="#a7843f" stroke-width="5" fill="none" opacity=".7"/>
      <!-- chân xếp bằng -->
      <ellipse cx="540" cy="985" rx="210" ry="66" fill="url(#goldBody)"/>
      <path d="M350 990 Q540 1040 730 990" stroke="#a7843f" stroke-width="5" fill="none" opacity=".7"/>
      <!-- tay kết ấn thiền -->
      <ellipse cx="540" cy="930" rx="74" ry="26" fill="#e3c27f"/>
      <path d="M476 930 Q540 952 604 930" stroke="#a7843f" stroke-width="4" fill="none"/>
      <!-- cổ, đầu -->
      <rect x="518" y="682" width="44" height="40" rx="12" fill="#d9b46a"/>
      <ellipse cx="484" cy="626" rx="13" ry="38" fill="#d4ad62"/>
      <ellipse cx="596" cy="626" rx="13" ry="38" fill="#d4ad62"/>
      <ellipse cx="540" cy="618" rx="60" ry="70" fill="url(#goldBody)"/>
      <!-- tóc xoắn, nhục kế -->
      <path d="M480 600 Q482 540 540 536 Q598 540 600 600 Q570 572 540 574 Q510 572 480 600Z" fill="#8c6a2e"/>

<script type="module">
  import { connectWS, initials } from '/ws-client.js';

  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  if (params.has('nen')) document.body.classList.add('nen');
  if (params.has('preview')) document.body.classList.add('preview');

  const stage = $('stage');
  // Co giãn khung 1080×1920 vừa với nguồn OBS, căn giữa
  const fit = () => {
    const { clientWidth: w, clientHeight: h } = document.documentElement;
    const s = Math.min(w / 1080, h / 1920);
    stage.style.transform = `translate(${(w - 1080 * s) / 2}px, ${(h - 1920 * s) / 2}px) scale(${s})`;
  };
  new ResizeObserver(fit).observe(document.documentElement);
  fit();

  // Bụi sáng vàng bay lên từ bàn thờ (chỉ hiện trong cảnh nền đầy đủ)
  const rand = (a, b) => a + Math.random() * (b - a);
  for (let i = 0; i < 22; i++) {
    const m = document.createElement('i');
    m.style.left = `${rand(250, 830)}px`;
    m.style.setProperty('--dx', `${rand(-80, 80)}px`);
    m.style.animationDuration = `${rand(11, 19)}s`;
    m.style.animationDelay = `${-rand(0, 19)}s`;
    const size = rand(5, 11);
    m.style.width = m.style.height = `${size}px`;
    $('motes').append(m);
  }

  function avatarEl(person, cls) {
    let el;
    if (person.avatar) {
      el = Object.assign(document.createElement('img'), { src: person.avatar, alt: '', referrerPolicy: 'no-referrer' });
      el.onerror = () => el.replaceWith(avatarEl({ ...person, avatar: null }, cls));
    } else {
      el = Object.assign(document.createElement('div'), { textContent: initials(person.nickname || person.username) });
    }
    el.className = cls;
    return el;
  }

  // ---------- Chánh điện: mỗi người xem là một Phật tử ----------
  // Mọi người xếp hàng 2 bên; lối giữa là lối vào dâng lễ. Mỗi lượt 3–5 người đi lối giữa lên bồ đoàn
  // quỳ lạy, dâng vật phẩm (bay lên bàn thờ), rồi đi lối giữa xuống và về cuối hàng. Ai đã donate được xếp lên trước.
  const KNEEL_Y = 1380;
  const KNEEL_SPOTS = [340, 440, 540, 640, 740].map((x) => ({ x, taken: null }));
  const AISLE_X = 540;
  const AISLE_END_Y = 1880;
  const scaleAt = (y) => 0.72 + (y - KNEEL_Y) * (1 - 0.72) / (1800 - KNEEL_Y);
  const MAX_PEOPLE = 16;
  // Chỗ đứng trong hàng: chẵn bên trái, lẻ bên phải; hàng chéo nhẹ ra mép để thấy rõ từng người
  const SLOT = (i) => {
    const k = Math.floor(i / 2);
    const side = i % 2 ? 1 : -1;
    return { x: AISLE_X + side * (200 + k * 30), y: 1440 + k * 60 };
  };
  const crowd = Array(MAX_PEOPLE).fill(null); // { person, el, lastActive, x, y, state, path, spot, item, kneelUntil }
  const line = []; // thứ tự xếp hàng
  const known = new Map(); // username -> thông tin người xem (để có avatar khi tặng quà)
  let total = 0;
  let viewers = 0;

  function renderCount() {
    $('count').textContent = viewers ? `Phật tử đang dự: ${viewers}` : `Phật tử đã về: ${total}`;
  }

  // Hình vật phẩm: hoa hồng / Rosa vẽ sẵn, quà khác dùng biểu tượng hộp quà
  const BUD = '<svg viewBox="0 0 60 60"><path d="M30 30 L30 56" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/><path d="M30 44 C20 38 13 42 12 48 C20 50 26 48 30 44Z" fill="#22c55e"/><path d="M30 40 C40 34 47 38 48 44 C40 46 34 44 30 40Z" fill="#4ade80"/><path d="M17 16 C17 6 43 6 43 16 C43 28 36 33 30 33 C24 33 17 28 17 16Z" fill="#f472b6"/><path d="M17 16 C22 12 28 14 30 20 C26 26 20 26 17 16Z" fill="#ec4899"/><path d="M43 16 C38 12 32 14 30 20 C34 26 40 26 43 16Z" fill="#db2777"/><path d="M24 10 C27 6 33 6 36 10 C33 13 27 13 24 10Z" fill="#fbcfe8"/></svg>';
  const ROSA = '<svg viewBox="0 0 60 60"><path d="M14 46 C6 46 3 52 4 56 C12 57 18 53 20 48Z" fill="#16a34a"/><path d="M46 46 C54 46 57 52 56 56 C48 57 42 53 40 48Z" fill="#22c55e"/><circle cx="30" cy="30" r="24" fill="#ef4444"/><path d="M8 30 C8 16 18 8 30 8 C22 14 18 22 18 30Z" fill="#f87171"/><path d="M52 30 C52 44 42 52 30 52 C38 46 42 38 42 30Z" fill="#dc2626"/><circle cx="30" cy="30" r="16" fill="#f87171"/><path d="M16 32 C18 20 26 16 34 18 C26 20 22 26 22 34Z" fill="#fca5a5"/><circle cx="30" cy="30" r="9" fill="#ef4444"/><path d="M26 30 C26 25 34 25 34 30 C34 34 29 35 28 32 C27 30 30 28 31 30" fill="none" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/></svg>';
  function renderItem(p) {
    const box = p.el.querySelector('.item');
    box.classList.remove('offer');
    if (!p.item) return box.replaceChildren();
    const g = String(p.item.gift).toLowerCase();
    const pic = document.createElement('div');
    if (g === 'rosa') pic.innerHTML = ROSA;
    else if (g === 'rose') pic.innerHTML = BUD;
    else pic.innerHTML = '<span class="emo">🎁</span>';
    box.replaceChildren(...pic.childNodes);
    if (p.item.count > 1) box.append(Object.assign(document.createElement('span'), { className: 'x', textContent: `x${p.item.count}` }));
  }

  const div = (className, ...kids) => {
    const el = Object.assign(document.createElement('div'), { className });
    el.append(...kids);
    return el;
  };
  function figure(person) {
    const el = div('pt walking',
      div('item'),
      div('fig',
        avatarEl(person, 'head'),
        div('torso', div('arm l'), div('robe'), div('arm r')),
        div('legs', div('leg l'), div('leg r')),
      ),
      Object.assign(document.createElement('div'), { className: 'nm', textContent: person.nickname || person.username }),
    );
    $('crowd').append(el);
    return el;
  }

  function releaseSpot(p) {
    if (p.spot) p.spot.taken = null;
    p.spot = null;
  }
  // Vào hàng: người có vật phẩm đứng sau những người có vật phẩm khác, trước người chưa donate
  function joinLine(p) {
    const at = line.indexOf(p);
    if (at >= 0) line.splice(at, 1);
    if (p.item) {
      const firstPlain = line.findIndex((q) => !q.item);
      line.splice(firstPlain < 0 ? line.length : firstPlain, 0, p);
    } else line.push(p);
    p.state = 'line';
  }

  // Đưa một người vào chánh điện (nếu chưa có). Hết chỗ thì thay người im lặng lâu nhất đang đứng hàng.
  function place(person, speaking = new Set()) {
    let i = crowd.findIndex((c) => c?.person.username === person.username);
    if (i >= 0) {
      crowd[i].lastActive = Date.now();
      return crowd[i];
    }
    i = crowd.findIndex((c) => !c);
    if (i < 0) {
      let oldest = -1;
      crowd.forEach((c, j) => {
        if (c.state !== 'line' || c.item || speaking.has(c.person.username)) return;
        if (oldest < 0 || c.lastActive < crowd[oldest].lastActive) oldest = j;
      });
      if (oldest < 0) return null;
      i = oldest;
      const gone = crowd[i];
      line.splice(line.indexOf(gone), 1);
      gone.el.classList.add('leaving');
      gone.el.addEventListener('animationend', () => gone.el.remove(), { once: true });
    }
    const p = {
      person,
      el: figure(person),
      lastActive: Date.now(),
      x: AISLE_X + (Math.random() < 0.5 ? -1 : 1) * rand(40, 80),
      y: AISLE_END_Y, // vào từ cuối lối giữa
      state: 'line',
      path: [],
      spot: null,
      item: null,
    };
    crowd[i] = p;
    joinLine(p);
    move(p);
    return p;
  }

  // Thêm vật phẩm donate lên đầu người tặng, xếp họ lên trước trong hàng
  function addItem(entry) {
    const person = known.get(entry.username) ?? { username: entry.username, nickname: entry.nickname };
    const p = place(person, speakingNow);
    if (!p) return;
    p.item = p.item && p.item.gift === entry.gift ? { gift: entry.gift, count: p.item.count + (entry.count || 1) } : { gift: entry.gift, count: entry.count || 1 };
    renderItem(p);
    if (p.state === 'line') joinLine(p);
  }

  function move(p) {
    const s = scaleAt(p.y);
    p.el.style.transform = `translate(${p.x - 75}px, ${p.y}px) translateY(-100%) scale(${s})`;
    if (!p.el.classList.contains('speaking')) p.el.style.zIndex = String(Math.round(p.y));
    // Bong bóng không tràn ra ngoài khung khi người đứng sát mép
    p.el.classList.toggle('edge-l', p.x < 300);
    p.el.classList.toggle('edge-r', p.x > 780);
  }

  // Đi thẳng tới (tx, ty); trả về true khi đã tới nơi
  function walkTo(p, tx, ty, dt) {
    const dx = tx - p.x;
    const dy = ty - p.y;
    const d = Math.hypot(dx, dy);
    const step = 75 * scaleAt(p.y) * dt;
    if (d <= step) {
      p.x = tx;
      p.y = ty;
      return true;
    }
    p.x += (dx / d) * step;
    p.y += (dy / d) * step;
    return false;
  }
  // Đi theo các điểm trong path; trả về true khi hết đường
  function follow(p, dt) {
    while (p.path.length && walkTo(p, p.path[0].x, p.path[0].y, dt)) p.path.shift();
    return !p.path.length;
  }

  // Lượt dâng lễ: khi bồ đoàn trống hết thì gọi 3–5 người đầu hàng đi lối giữa lên
  let nextBatchAt = performance.now() + 2500;
  function callBatch(now) {
    if (now < nextBatchAt || KNEEL_SPOTS.some((k) => k.taken)) return;
    const n = Math.min(line.length, 3 + Math.floor(Math.random() * 3));
    if (!n) return;
    const batch = line.splice(0, n);
    // xếp vào bồ đoàn từ giữa ra hai bên
    const order = [2, 1, 3, 0, 4];
    batch.forEach((p, j) => {
      const spot = KNEEL_SPOTS[order[j]];
      spot.taken = p;
      p.spot = spot;
      p.state = 'go';
      const laneX = AISLE_X + (p.x < AISLE_X ? -30 : 30);
      p.path = [{ x: laneX, y: Math.max(p.y, KNEEL_Y + 60) }, { x: laneX, y: KNEEL_Y + 40 }, { x: spot.x, y: KNEEL_Y }];
    });
    nextBatchAt = Infinity;
  }

  // Vòng lặp: đứng hàng (đi tới đúng chỗ của mình), lượt tới thì đi lối giữa lên quỳ lạy, dâng lễ rồi về cuối hàng
  let last = performance.now();
  function tick(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    callBatch(now);
    line.forEach((p, i) => {
      if (i < MAX_PEOPLE) p.slot = SLOT(i);
    });
    let anyAtAltar = false;
    for (const p of crowd) {
      if (!p) continue;
      let walking = false;
      if (p.state === 'line') {
        walking = !walkTo(p, p.slot.x, p.slot.y, dt);
      } else if (p.state === 'go') {
        walking = !follow(p, dt);
        if (!walking) {
          p.state = 'kneel';
          p.kneelUntil = now + rand(8000, 11000);
          // dâng vật phẩm: bay lên bàn thờ
          if (p.item) {
            const box = p.el.querySelector('.item');
            setTimeout(() => {
              box.classList.add('offer');
              box.addEventListener('animationend', () => { p.item = null; renderItem(p); }, { once: true });
            }, 2500);
          }
        }
      } else if (p.state === 'kneel') {
        if (now >= p.kneelUntil) {
          releaseSpot(p);
          p.state = 'back';
          const laneX = AISLE_X + (p.x < AISLE_X ? -30 : 30);
          p.path = [{ x: laneX, y: KNEEL_Y + 40 }, { x: laneX, y: AISLE_END_Y }];
        }
      } else if (p.state === 'back') {
        walking = !follow(p, dt);
        if (!walking) joinLine(p);
      }
      if (p.state === 'go' || p.state === 'kneel') anyAtAltar = true;
      const kneeling = p.state === 'kneel';
      p.el.classList.toggle('walking', walking);
      p.el.classList.toggle('kneel', kneeling);
      p.el.classList.toggle('lay', kneeling);
      p.el.classList.toggle('bowing', !walking && !kneeling && !p.el.classList.contains('speaking'));
      move(p);
    }
    // lượt trước đã rời bồ đoàn thì nghỉ một chút rồi gọi lượt sau
    if (!anyAtAltar && nextBatchAt === Infinity) nextBatchAt = now + 2500;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  if (params.has('preview')) window.thuVatPham = (username, gift = 'Rose', count = 1) => addItem({ username, nickname: username, gift, count });

  function addMember(m) {
    known.set(m.username, m);
    place(m, speakingNow);
  }

  // ---------- Lời chào Phật tử mới (xếp hàng, không dồn quá nhiều) ----------
  const welcomeQueue = [];
  let welcoming = false;
  function welcome(m) {
    welcomeQueue.push(m);
    if (welcomeQueue.length > 4) welcomeQueue.splice(0, welcomeQueue.length - 4);
    if (!welcoming) nextWelcome();
  }
  function nextWelcome() {
    const m = welcomeQueue.shift();
    const el = $('welcome');
    if (!m) {
      welcoming = false;
      el.classList.remove('show');
      return;
    }
    welcoming = true;
    el.textContent = `🙏 A Di Đà Phật! Phật tử ${m.nickname || m.username} vừa về chùa`;
    el.classList.add('show');
    setTimeout(() => {
      el.classList.remove('show');
      setTimeout(nextWelcome, 500);
    }, 2800);
  }

  // ---------- Thành tâm tri ân khi có người tặng quà (hoa sen vàng nở, 6 giây, xếp hàng) ----------
  // Không hiện số xu / số tiền, chỉ tên công khai
  const thanksQueue = [];
  let thanking = false;
  function thank(entry) {
    const name = entry.nickname || entry.username;
    if (thanksQueue.some((n) => n === name)) return; // một người tặng liên tục chỉ tri ân một lần trong hàng chờ
    thanksQueue.push(name);
    if (thanksQueue.length > 6) thanksQueue.shift();
    if (!thanking) nextThanks();
  }
  function nextThanks() {
    const name = thanksQueue.shift();
    const box = $('thanks');
    if (!name) {
      thanking = false;
      return;
    }
    thanking = true;
    $('thanksName').textContent = `Phật tử ${name}`;
    box.classList.add('show');
    setTimeout(() => {
      box.classList.remove('show');
      setTimeout(nextThanks, 900);
    }, 6000);
  }

  // ---------- Bình luận hiện thành bong bóng trên đầu người bình luận ----------
  let speakingNow = new Set();
  function renderComments(showing) {
    const latest = new Map(); // username -> bình luận mới nhất đang hiển thị
    for (const c of showing) latest.set(c.username, c);
    speakingNow = new Set(latest.keys());

    for (const c of latest.values()) {
      const spot = place(c, speakingNow);
      if (!spot) continue;
      spot.el.classList.add('speaking');
      spot.el.style.zIndex = '5000'; // bong bóng nổi trên mọi người khác
      let bubble = spot.el.querySelector('.bubble:not(.leaving)');
      if (bubble?.dataset.id === c.id) continue;
      bubble?.remove();
      bubble = Object.assign(document.createElement('div'), { className: 'bubble', textContent: c.text });
      bubble.dataset.id = c.id;
      spot.el.prepend(bubble);
    }
    for (const spot of crowd) {
      if (!spot || speakingNow.has(spot.person.username)) continue;
      spot.el.classList.remove('speaking');
      spot.el.style.zIndex = String(Math.round(spot.y));
      const bubble = spot.el.querySelector('.bubble:not(.leaving)');
      if (bubble) {
        bubble.classList.add('leaving');
        bubble.addEventListener('animationend', () => bubble.remove(), { once: true });
      }
    }
  }

  function resetCrowd() {
    for (const p of crowd) p?.el.remove();
    crowd.fill(null);
    line.length = 0;
    KNEEL_SPOTS.forEach((k) => (k.taken = null));
    nextBatchAt = performance.now() + 2500;
  }

  function applySettings(s) {
    document.documentElement.style.setProperty('--font', `${Math.min(s.fontSize, 34)}px`);
  }

  connectWS((msg) => {
    switch (msg.type) {
      case 'hello':
        applySettings(msg.settings);
        resetCrowd();
        for (const m of msg.members) known.set(m.username, m);
        msg.members.slice(-MAX_PEOPLE).forEach((m) => place(m));
        // quà trong 10 phút gần đây: hiện vật phẩm trên đầu người tặng
        for (const g of (msg.gifts ?? []).filter((g) => Date.now() - g.at < 10 * 60 * 1000)) addItem(g);
        total = msg.members.length;
        viewers = msg.viewers;
        renderCount();
        renderComments(msg.showing);
        break;
      case 'member':
        total = msg.total;
        addMember(msg.member);
        renderCount();
        if (msg.isNew) welcome(msg.member);
        break;
      case 'members':
        total = 0;
        resetCrowd();
        renderCount();
        break;
      case 'viewers':
        viewers = msg.viewers;
        renderCount();
        break;
      case 'present': addMember(msg.member); break;
      case 'gift': addItem(msg.entry); thank(msg.entry); break;
      case 'settings': applySettings(msg.settings); break;
      case 'showing': renderComments(msg.showing); break;
    }
  });
</script>
</body>
</html>
