<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay chùa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@500;700&family=Be+Vietnam+Pro:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* Thiết kế cho khung dọc 1080×1920, tự co giãn theo kích thước nguồn trong OBS.
     Mặc định phần giữa trong suốt để thấy camera; thêm ?nen để có cảnh chùa đầy đủ làm nền. */
  :root {
    --font: 30px;
    --gold: #f2c14e;
    --gold-dark: #b8860b;
    --red: #9b1c1c;
    --red-dark: #5c0f0f;
    --paper: #fbf1d6;
    --ink: #3b2412;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif; }
  body.preview { background: repeating-conic-gradient(#1e293b 0 25%, #172033 0 50%) 0 0 / 32px 32px; }

  #stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1080px;
    height: 1920px;
    transform-origin: 0 0;
  }
  #stage > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #scene { display: none; }
  body.nen #scene { display: block; }

  .lantern { transform-box: fill-box; transform-origin: 50% 0; animation: sway 4s ease-in-out infinite alternate; }
  .lantern.b { animation-delay: -2s; }
  @keyframes sway { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
  .smoke { animation: rise 6s ease-out infinite; opacity: 0; }
  .smoke.b { animation-delay: -2s; }
  .smoke.c { animation-delay: -4s; }
  @keyframes rise {
    0% { opacity: 0; transform: translateY(0) scale(.6); }
    20% { opacity: .55; }
    100% { opacity: 0; transform: translateY(-260px) scale(1.6); }
  }
  .glow { animation: glow 3s ease-in-out infinite alternate; }
  @keyframes glow { from { opacity: .55; } to { opacity: 1; } }

  /* Câu đối trên cột */
  .couplet {
    position: absolute;
    top: 620px;
    width: 64px;
    writing-mode: vertical-rl;
    text-orientation: upright;
    font: 700 34px/64px "Noto Serif", serif;
    letter-spacing: 6px;
    color: var(--gold);
    text-align: center;
    text-shadow: 0 2px 2px rgba(0, 0, 0, .5);
  }
  .couplet.l { left: 0; }
  .couplet.r { right: 0; }

  /* Thông báo Phật tử mới vào */
  #welcome {
    position: absolute;
    left: 50%;
    top: 520px;
    transform: translateX(-50%);
    padding: 12px 34px;
    border-radius: 999px;
    background: linear-gradient(90deg, #8a5a00, #e0a82e 50%, #8a5a00);
    color: #2a1600;
    font: 600 26px/1.3 "Be Vietnam Pro", sans-serif;
    white-space: nowrap;
    max-width: 600px;
    overflow: hidden;
    text-overflow: ellipsis;
    box-shadow: 0 6px 20px rgba(0, 0, 0, .35);
    opacity: 0;
    transition: opacity .4s, transform .4s;
  }
  #welcome.show { opacity: 1; transform: translateX(-50%) translateY(6px); }

  /* Số Phật tử đang dự */
  #count {
    position: absolute;
    left: 50%;
    top: 600px;
    transform: translateX(-50%);
    padding: 6px 22px;
    border-radius: 10px;
    background: rgba(92, 15, 15, .88);
    border: 3px solid var(--gold-dark);
    color: var(--gold);
    font: 700 24px/1.3 "Noto Serif", serif;
    white-space: nowrap;
  }

  /* Phật tử đứng trong sân chùa: avatar làm đầu, áo tràng, tên bên dưới */
  .pt {
    position: absolute;
    left: 0;
    top: 0;
    width: 150px;
    display: flex;
    flex-direction: column;
    align-items: center;
    transform-origin: 50% 100%;
    animation: arrive .6s ease-out both;
  }
  .pt.leaving { animation: depart .5s ease-in both; }
  @keyframes arrive { from { opacity: 0; translate: 0 30px; } }
  @keyframes depart { to { opacity: 0; translate: 0 20px; } }
  .pt .head {
    width: 72px; height: 72px; border-radius: 50%;
    object-fit: cover;
    border: 4px solid #f3e2b3;
    background: #c08a5a; color: #fff;
    display: grid; place-items: center;
    font: 600 30px/1 "Be Vietnam Pro", sans-serif;
    position: relative; z-index: 1;
    box-shadow: 0 4px 10px rgba(0, 0, 0, .35);
  }
  .pt .robe {
    width: 96px; height: 92px; margin-top: -10px;
    background: linear-gradient(180deg, #8d6e63, #6d4c41);
    border-radius: 44px 44px 14px 14px;
    position: relative;
    box-shadow: 0 6px 12px rgba(0, 0, 0, .35);
  }
  .pt .robe::before { /* cổ áo chéo */
    content: ""; position: absolute; left: 50%; top: 6px; width: 34px; height: 34px;
    border-left: 4px solid #4e342e; border-bottom: 4px solid #4e342e;
    transform: translateX(-50%) rotate(-45deg); border-radius: 0 0 0 6px;
  }
  .pt .robe::after { /* tay chắp */
    content: "🙏"; position: absolute; left: 50%; top: 40px; transform: translateX(-50%);
    font-size: 30px;
  }
  .pt .nm {
    margin-top: 6px; max-width: 160px;
    padding: 2px 10px; border-radius: 999px;
    background: rgba(59, 36, 18, .85); color: var(--paper);
    font: 600 19px/1.3 "Be Vietnam Pro", sans-serif;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pt.speaking .head { border-color: var(--gold); box-shadow: 0 0 0 6px rgba(242, 193, 78, .45), 0 4px 10px rgba(0, 0, 0, .35); }
  .pt.speaking .robe { animation: bob .8s ease-in-out infinite alternate; }
  @keyframes bob { to { transform: translateY(-4px); } }
  /* Bước đi: nhún nhẹ, lắc người */
  .pt.walking .head, .pt.walking .robe { animation: step .55s ease-in-out infinite alternate; }
  .pt.walking .robe { animation-name: sway-robe; }
  @keyframes step { from { transform: translateY(0) rotate(-3deg); } to { transform: translateY(-6px) rotate(3deg); } }
  @keyframes sway-robe { from { transform: translateY(0) rotate(-2deg); } to { transform: translateY(-4px) rotate(2deg); } }
  /* Dừng lại chắp tay vái */
  .pt.bowing .head { animation: bow 2s ease-in-out infinite; }
  @keyframes bow { 0%, 100% { transform: none; } 40%, 60% { transform: translateY(10px) rotate(0deg) scale(.96); } }

  /* Bong bóng bình luận trên đầu */
  .bubble {
    position: absolute;
    bottom: calc(100% + 14px);
    left: 50%;
    transform: translateX(-50%);
    width: max-content;
    max-width: 420px;
    padding: 12px 18px;
    border-radius: 18px;
    background: var(--paper);
    border: 3px solid var(--red);
    color: var(--ink);
    font: 500 var(--font)/1.3 "Be Vietnam Pro", sans-serif;
    overflow-wrap: anywhere;
    box-shadow: 0 8px 22px rgba(0, 0, 0, .4);
    animation: pop .35s cubic-bezier(.2, .9, .3, 1.3) both;
  }
  .bubble::after { /* đuôi bong bóng */
    content: ""; position: absolute; top: 100%; left: 50%;
    border: 14px solid transparent; border-top-color: var(--red);
    transform: translateX(-50%);
  }
  .edge-l .bubble { left: 0; transform: none; }
  .edge-l .bubble::after { left: 60px; }
  .edge-r .bubble { left: auto; right: 0; transform: none; }
  .edge-r .bubble::after { left: auto; right: 46px; transform: none; }
  .bubble.leaving { animation: unpop .3s ease-in both; }
  @keyframes pop { from { opacity: 0; scale: .6; } }
  @keyframes unpop { to { opacity: 0; scale: .8; } }
</style>
</head>
<body>

<script type="module">
  import { connectWS, initials } from '/ws-client.js';

  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  if (params.has('nen')) document.body.classList.add('nen');
  if (params.has('preview')) document.body.classList.add('preview');

  const stage = $('stage');
  // Co giãn khung 1080×1920 vừa với nguồn OBS, căn giữa
  const fit = () => {
    const { clientWidth: w, clientHeight: h } = document.documentElement;
    const s = Math.min(w / 1080, h / 1920);
    stage.style.transform = `translate(${(w - 1080 * s) / 2}px, ${(h - 1920 * s) / 2}px) scale(${s})`;
  };
  new ResizeObserver(fit).observe(document.documentElement);
  fit();

  function avatarEl(person, cls) {
    let el;
    if (person.avatar) {
      el = Object.assign(document.createElement('img'), { src: person.avatar, alt: '', referrerPolicy: 'no-referrer' });
      el.onerror = () => el.replaceWith(avatarEl({ ...person, avatar: null }, cls));
    } else {
      el = Object.assign(document.createElement('div'), { textContent: initials(person.nickname || person.username) });
    }
    el.className = cls;
    return el;
  }

  // ---------- Sân chùa: mỗi người xem là một Phật tử ----------
  // 3 lối đi trong sân (vị trí chân); lối xa nhỏ hơn và đi chậm hơn để có chiều sâu
  const LANES = [
    { y: 1250, s: 0.78 },
    { y: 1420, s: 0.89 },
    { y: 1600, s: 1 },
  ];
  const MAX_PEOPLE = 16;
  const X_MIN = 130;
  const X_MAX = 950;
  const crowd = Array(MAX_PEOPLE).fill(null); // { person, el, lastActive, lane, x, dir, speed, pauseUntil, nextPauseAt }
  const rand = (a, b) => a + Math.random() * (b - a);
  let total = 0;
  let viewers = 0;

  function renderCount() {
    $('count').textContent = viewers ? `Phật tử đang dự: ${viewers}` : `Phật tử đã về: ${total}`;
  }

  function figure(person) {
    const el = document.createElement('div');
    el.className = 'pt walking';
    el.append(
      avatarEl(person, 'head'),
      Object.assign(document.createElement('div'), { className: 'robe' }),
      Object.assign(document.createElement('div'), { className: 'nm', textContent: person.nickname || person.username }),
    );
    $('crowd').append(el);
    return el;
  }

  // Đưa một người vào sân (nếu chưa có). Hết chỗ thì thay người im lặng lâu nhất.
  function place(person, speaking = new Set()) {
    let i = crowd.findIndex((c) => c?.person.username === person.username);
    if (i >= 0) {
      crowd[i].lastActive = Date.now();
      return crowd[i];
    }
    i = crowd.findIndex((c) => !c);
    if (i < 0) {
      let oldest = -1;
      crowd.forEach((c, j) => {
        if (!speaking.has(c.person.username) && (oldest < 0 || c.lastActive < crowd[oldest].lastActive)) oldest = j;
      });
      if (oldest < 0) return null;
      i = oldest;
      const old = crowd[i].el;
      old.classList.add('leaving');
      old.addEventListener('animationend', () => old.remove(), { once: true });
    }
    const now = performance.now();
    crowd[i] = {
      person,
      el: figure(person),
      lastActive: Date.now(),
      lane: LANES[i % LANES.length],
      x: rand(X_MIN, X_MAX),
      dir: Math.random() < 0.5 ? -1 : 1,
      speed: rand(28, 60),
      pauseUntil: 0,
      nextPauseAt: now + rand(3000, 9000),
    };
    move(crowd[i]);
    return crowd[i];
  }

  function move(p) {
    const { y, s } = p.lane;
    p.el.style.transform = `translate(${p.x - 75}px, ${y}px) translateY(-100%) scale(${s})`;
    if (!p.el.classList.contains('speaking')) p.el.style.zIndex = String(y);
    // Bong bóng không tràn ra ngoài khung khi người đứng sát mép
    p.el.classList.toggle('edge-l', p.x < 300);
    p.el.classList.toggle('edge-r', p.x > 780);
  }

  // Vòng lặp đi lại: đi theo lối, tới mép thì quay lại, thỉnh thoảng dừng chắp tay vái
  let last = performance.now();
  function tick(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    for (const p of crowd) {
      if (!p) continue;
      const speaking = p.el.classList.contains('speaking');
      if (!speaking && now >= p.nextPauseAt && now >= p.pauseUntil) {
        p.pauseUntil = now + rand(1500, 4000);
        p.nextPauseAt = p.pauseUntil + rand(4000, 10000);
        if (Math.random() < 0.35) p.dir *= -1; // dừng xong có khi quay đầu
      }
      const walking = !speaking && now >= p.pauseUntil;
      p.el.classList.toggle('walking', walking);
      p.el.classList.toggle('bowing', !speaking && !walking);
      if (walking) {
        p.x += p.dir * p.speed * p.lane.s * dt;
        if (p.x < X_MIN) { p.x = X_MIN; p.dir = 1; }
        if (p.x > X_MAX) { p.x = X_MAX; p.dir = -1; }
      }
      move(p);
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  function addMember(m) {
    place(m, speakingNow);
  }

  // ---------- Lời chào Phật tử mới (xếp hàng, không dồn quá nhiều) ----------
  const welcomeQueue = [];
  let welcoming = false;
  function welcome(m) {
    welcomeQueue.push(m);
    if (welcomeQueue.length > 4) welcomeQueue.splice(0, welcomeQueue.length - 4);
    if (!welcoming) nextWelcome();
  }
  function nextWelcome() {
    const m = welcomeQueue.shift();
    const el = $('welcome');
    if (!m) {
      welcoming = false;
      el.classList.remove('show');
      return;
    }
    welcoming = true;
    el.textContent = `🙏 A Di Đà Phật! Phật tử ${m.nickname || m.username} vừa về chùa`;
    el.classList.add('show');
    setTimeout(() => {
      el.classList.remove('show');
      setTimeout(nextWelcome, 450);
    }, 2600);
  }

  // ---------- Bình luận hiện thành bong bóng trên đầu người bình luận ----------
  let speakingNow = new Set();
  function renderComments(showing) {
    const latest = new Map(); // username -> bình luận mới nhất đang hiển thị
    for (const c of showing) latest.set(c.username, c);
    speakingNow = new Set(latest.keys());

    for (const c of latest.values()) {
      const spot = place(c, speakingNow);
      if (!spot) continue;
      spot.el.classList.add('speaking');
      spot.el.style.zIndex = '5000'; // bong bóng nổi trên mọi người khác
      let bubble = spot.el.querySelector('.bubble:not(.leaving)');
      if (bubble?.dataset.id === c.id) continue;
      bubble?.remove();
      bubble = Object.assign(document.createElement('div'), { className: 'bubble', textContent: c.text });
      bubble.dataset.id = c.id;
      spot.el.prepend(bubble);
    }
    for (const spot of crowd) {
      if (!spot || speakingNow.has(spot.person.username)) continue;
      spot.el.classList.remove('speaking');
      spot.el.style.zIndex = String(spot.lane.y);
      const bubble = spot.el.querySelector('.bubble:not(.leaving)');
      if (bubble) {
        bubble.classList.add('leaving');
        bubble.addEventListener('animationend', () => bubble.remove(), { once: true });
      }
    }
  }

  function applySettings(s) {
    document.documentElement.style.setProperty('--font', `${Math.min(s.fontSize, 34)}px`);
  }

  connectWS((msg) => {
    switch (msg.type) {
      case 'hello':
        applySettings(msg.settings);
        for (const spot of crowd) spot?.el.remove();
        crowd.fill(null);
        msg.members.slice(-MAX_PEOPLE).forEach((m) => place(m));
        total = msg.members.length;
        viewers = msg.viewers;
        renderCount();
        renderComments(msg.showing);
        break;
      case 'member':
        total = msg.total;
        addMember(msg.member);
        renderCount();
        if (msg.isNew) welcome(msg.member);
        break;
      case 'members':
        total = 0;
        for (const spot of crowd) spot?.el.remove();
        crowd.fill(null);
        renderCount();
        break;
      case 'viewers':
        viewers = msg.viewers;
        renderCount();
        break;
      case 'settings': applySettings(msg.settings); break;
      case 'showing': renderComments(msg.showing); break;
    }
  });
</script>
</body>
</html>
