<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay nhà máy carton</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;800&display=swap" rel="stylesheet">
<style>
  /* Thiết kế cho khung dọc 1080×1920, tự co giãn theo kích thước nguồn trong OBS. */
  :root {
    --font: 30px;
    --steel: #475569;
    --steel-dark: #1f2937;
    --safety: #facc15;
    --kraft: #c8975a;
    --kraft-dark: #9a6b35;
    --paper: #fffaf0;
    --ink: #1f2937;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif; }
  body.preview { background: #0f172a; }
  /* ?an-toan: thu nhỏ khung để điện thoại màn hình dài không cắt mất hai bên; viền tô nền kín (che camera bên dưới) */
  body.an-toan { background: var(--steel-dark); }

  /* #frame: khung màn hình 1080×1920 (co giãn theo OBS), cắt phần ngoài.
     #stage: toàn bộ nhà máy, máy quay ảo zoom/lia bên trong. #hud: chữ cố định, không zoom. */
  #frame { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; overflow: hidden; }
  /* isolation: mọi nhân vật nằm gọn trong lớp nhà máy, bảng thông báo (#hud) luôn nằm trên cùng */
  #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; z-index: 0; isolation: isolate; }
  #hud { position: absolute; inset: 0; pointer-events: none; z-index: 100; }
  #shotBar {
    position: absolute; left: 24px; right: 24px; top: 200px; height: 110px;
    display: flex; align-items: center; gap: 18px; padding: 0 22px;
    background: rgba(255, 255, 255, .95); border: 5px solid #e00000; border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .35);
    opacity: 0; transform: translateY(-20px); transition: opacity .5s, transform .5s;
  }
  #shotBar.show { opacity: 1; transform: none; }
  #shotBar img { width: 72px; height: 72px; }
  #shotBar .brand { font: 800 36px/1.1 "Be Vietnam Pro", sans-serif; color: #e00000; white-space: nowrap; }
  #shotBar .brand small { display: block; font-size: 20px; color: #1f2937; }
  #shotName {
    margin-left: auto; padding: 8px 16px; border-radius: 10px;
    background: #0f3d7a; color: #fff; font: 800 28px/1.2 "Be Vietnam Pro", sans-serif; white-space: nowrap;
  }
  #shotName::before { content: "● "; color: #ef4444; animation: blink 1s steps(2) infinite; }
  #stage > svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* Chuyển động máy móc */
  .spin { transform-box: fill-box; transform-origin: center; animation: spin 2s linear infinite; }
  .spin.rev { animation-direction: reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .flow { animation: flow 4s linear infinite; }
  @keyframes flow {
    0% { transform: translateX(0); opacity: 0; }
    8%, 92% { opacity: 1; }
    100% { transform: translateX(var(--d)); opacity: 0; }
  }
  .press { animation: press 1.6s ease-in-out infinite; }
  @keyframes press { 0%, 100% { transform: translateY(0); } 45%, 55% { transform: translateY(var(--d)); } }
  .flap { transform-box: fill-box; transform-origin: 0 100%; animation: flap 2s ease-in-out infinite; }
  @keyframes flap { 0%, 20% { transform: rotate(0); } 60%, 100% { transform: rotate(-150deg); } }
  .blink { animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .heat { animation: heat 1.8s ease-in-out infinite alternate; }
  @keyframes heat { from { opacity: .35; } to { opacity: .9; } }
  /* Máy chấm công nháy khi quẹt thẻ */
  #clockLed.scan { fill: #22c55e; animation: blink .25s steps(2) 6; }
  #clockBox.scan { stroke: #22c55e; }
  .shine { animation: shine 2.4s linear infinite; }
  @keyframes shine { from { transform: translateX(-40px); } to { transform: translateX(260px); } }

  /* Biển xưởng và thông báo */
  #count {
    position: absolute; right: 40px; top: 312px; transition: top .5s;
    padding: 6px 18px; border-radius: 10px;
    background: rgba(17, 24, 39, .85); border: 3px solid var(--safety);
    color: var(--safety); font: 800 32px/1.3 "Be Vietnam Pro", sans-serif;
  }
  #welcome {
    position: absolute; left: 24px; top: 380px; transition: top .5s;
    max-width: 1000px; padding: 10px 24px; border-radius: 10px;
    background: repeating-linear-gradient(-45deg, #facc15 0 18px, #eab308 18px 36px);
    color: #111827; font: 800 32px/1.3 "Be Vietnam Pro", sans-serif;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    box-shadow: 0 6px 18px rgba(0, 0, 0, .35);
    opacity: 0; transform: translateY(-8px); transition: opacity .4s, transform .4s;
  }
  #welcome.show { opacity: 1; transform: none; }
  #hud.zoomed #count { top: 326px; }
  #hud.zoomed #welcome { top: 394px; }

  /* Công nhân: mặt là avatar thật, mũ bảo hộ, áo phản quang, tay thao tác máy */
  .wk {
    position: absolute; left: 0; top: 0; width: 130px;
    display: flex; flex-direction: column; align-items: center;
    transform-origin: 50% 100%;
    animation: arrive .6s ease-out both;
  }
  .wk.leaving { animation: depart .5s ease-in both; }
  @keyframes arrive { from { opacity: 0; translate: 0 24px; } }
  @keyframes depart { to { opacity: 0; translate: 0 24px; } }
  .wk .hat {
    position: relative; z-index: 2;
    width: 74px; height: 30px; margin-bottom: -14px;
    background: linear-gradient(180deg, #fde047, #eab308);
    border-radius: 40px 40px 4px 4px;
    box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .15);
  }
  .wk .hat::after {
    content: ""; position: absolute; left: -9px; right: -9px; bottom: -4px; height: 8px;
    background: #ca8a04; border-radius: 6px;
  }
  .wk .face {
    position: relative; z-index: 1;
    width: 64px; height: 64px; border-radius: 50%;
    object-fit: cover; border: 3px solid #e8b48a;
    background: #e8b48a; color: #7c2d12;
    display: grid; place-items: center;
    font: 800 26px/1 "Be Vietnam Pro", sans-serif;
  }
  .wk svg.body { width: 110px; height: 150px; margin-top: -6px; overflow: visible; }
  .wk .nm {
    margin-top: 2px; max-width: 170px;
    padding: 2px 10px; border-radius: 6px;
    background: rgba(17, 24, 39, .88); color: #fef9c3;
    font: 600 19px/1.3 "Be Vietnam Pro", sans-serif;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .arm { transform-box: view-box; }
  .arm.l { transform-origin: 30px 34px; }
  .arm.r { transform-origin: 80px 34px; }
  .leg { transform-box: view-box; }
  .leg.l { transform-origin: 46px 96px; }
  .leg.r { transform-origin: 64px 96px; }
  .wk.working .arm.l { animation: work-l 1.1s ease-in-out infinite alternate; }
  .wk.working .arm.r { animation: work-r 1.3s ease-in-out infinite alternate; }
  @keyframes work-l { from { transform: rotate(8deg); } to { transform: rotate(-58deg); } }
  @keyframes work-r { from { transform: rotate(-42deg); } to { transform: rotate(12deg); } }
  .wk.walking .leg.l { animation: stride 0.5s ease-in-out infinite alternate; }
  .wk.walking .leg.r { animation: stride 0.5s ease-in-out infinite alternate-reverse; }
  .wk.walking .arm.l { animation: swing 0.5s ease-in-out infinite alternate-reverse; }
  .wk.walking .arm.r { animation: swing 0.5s ease-in-out infinite alternate; }
  @keyframes stride { from { transform: rotate(-12deg); } to { transform: rotate(12deg); } }
  @keyframes swing { from { transform: rotate(-14deg); } to { transform: rotate(14deg); } }
  /* Ông chủ: mũ trắng, thẻ chức danh, to hơn công nhân */
  .wk.boss .hat { background: linear-gradient(180deg, #ffffff, #d1d5db); }
  .wk.boss .hat::after { background: #9ca3af; }
  .wk.boss .face { border-color: #facc15; box-shadow: 0 0 0 5px rgba(250, 204, 21, .5); }
  .wk.boss .nm { background: #7f1d1d; color: #fde68a; font-size: 22px; }
  .wk .title {
    margin-top: 3px; padding: 2px 10px; border-radius: 6px;
    background: linear-gradient(90deg, #b45309, #facc15, #b45309); color: #1f2937;
    font: 800 18px/1.3 "Be Vietnam Pro", sans-serif; white-space: nowrap;
  }
  /* Chức vụ: màu mũ + thẻ chức danh theo cấp */
  .wk.lv-2 .hat { background: linear-gradient(180deg, #fdba74, #ea580c); }
  .wk.lv-3 .hat { background: linear-gradient(180deg, #93c5fd, #2563eb); }
  .wk.lv-4 .hat { background: linear-gradient(180deg, #86efac, #16a34a); }
  .wk.lv-5 .hat, .wk.lv-6 .hat, .wk.lv-7 .hat { background: linear-gradient(180deg, #ffffff, #d1d5db); }
  .wk.lv-5 .hat::after, .wk.lv-6 .hat::after, .wk.lv-7 .hat::after { background: #9ca3af; }
  .wk.lv-7 .face { border-color: #facc15; }
  .title.staff { background: #e00000; color: #fff; }
  .title.job { background: #334155; color: #fff; }
  .wk.job-bao-ve .hat { background: linear-gradient(180deg, #1e3a8a, #172554); border-radius: 12px 12px 4px 4px; }
  .wk.job-bao-ve .hat::after { background: #0f172a; left: -4px; right: -14px; }
  .wk.job-lao-cong .hat { background: linear-gradient(180deg, #4ade80, #15803d); }
  .wk.job-lao-cong .hat::after { background: #166534; }
  .wk.job-thu-ky .hat, .wk.job-ke-toan .hat { display: none; }
  .wk.sweeping .arm.r { animation: sweep .45s ease-in-out infinite alternate; }
  @keyframes sweep { from { transform: rotate(-22deg); } to { transform: rotate(18deg); } }
  .title.lead { background: linear-gradient(90deg, #b45309, #facc15, #b45309); color: #1f2937; }
  .wk.lead .hat { background: linear-gradient(180deg, #fff7c2, #f59e0b); box-shadow: 0 0 12px rgba(250, 204, 21, .8); }
  .wk.lead .face { border-color: #facc15; }
  .wk[data-staff] .face { background: none; overflow: hidden; }
  .wk[data-staff] .face svg { width: 100%; height: 100%; }
  .title.lv-0 { background: #6b7280; color: #fff; }
  .title.lv-1 { background: #0ea5e9; color: #fff; }
  .title.lv-2 { background: #ea580c; color: #fff; }
  .title.lv-3 { background: #2563eb; color: #fff; }
  .title.lv-4 { background: #16a34a; color: #fff; }
  .title.lv-5 { background: #7c3aed; color: #fff; }
  .title.lv-6 { background: #0f172a; color: #fde68a; }
  .title.lv-7 { background: linear-gradient(90deg, #b45309, #facc15, #b45309); color: #1f2937; }
  /* Thăng chức: sáng vàng + pháo giấy */
  .wk.promoted .face { box-shadow: 0 0 0 8px rgba(250, 204, 21, .7), 0 0 40px 10px rgba(250, 204, 21, .6); }
  .wk.promoted .title { animation: titlePop .6s cubic-bezier(.2, .9, .3, 1.4) 3; }
  @keyframes titlePop { 50% { transform: scale(1.35); } }
  .confetti { position: absolute; left: 50%; top: 10px; width: 0; height: 0; z-index: 3; pointer-events: none; }
  .confetti i {
    position: absolute; width: 10px; height: 16px; border-radius: 2px;
    animation: burst 1.8s cubic-bezier(.15, .7, .4, 1) forwards;
  }
  @keyframes burst {
    0% { transform: translate(0, 0) rotate(0); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(var(--r)); opacity: 0; }
  }
  /* Bảng vinh danh */
  #honor {
    position: absolute; right: 24px; bottom: 300px; width: 540px;
    padding: 14px 18px 16px; border-radius: 16px;
    background: rgba(17, 24, 39, .9); border: 3px solid #facc15;
    color: #f9fafb; font: 700 28px/1.3 "Be Vietnam Pro", sans-serif;
  }
  #honor h3 { margin: 0 0 8px; font: 800 32px/1.2 "Be Vietnam Pro", sans-serif; color: #facc15; text-align: center; }
  #honor ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  #honor li { display: grid; grid-template-columns: 44px 1fr auto; gap: 8px; align-items: center; }
  #honor li .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #honor li .t { font-size: 20px; padding: 1px 8px; border-radius: 6px; white-space: nowrap; }
  #honor li .p { grid-column: 2 / -1; font-size: 20px; color: #cbd5e1; margin-top: -4px; }
  #honor:empty, #honor.empty { display: none; }
  body:not(.vinh-danh) #honor { display: none; } /* tắt mặc định; thêm ?vinh-danh vào URL để hiện */
  /* Đoàn khách hàng audit */
  .wk.visitor .hat { background: linear-gradient(180deg, #e0f2fe, #38bdf8); }
  .wk.visitor .hat::after { background: #0284c7; }
  .wk.visitor .face { background: none; border-color: #fde68a; overflow: hidden; }
  .wk.visitor .face svg { width: 100%; height: 100%; }
  .wk.visitor .title { color: #fff; }
  .wk.visitor.member .nm { display: none; }
  /* Thẻ đeo có logo công ty */
  .wk.visitor .title.logo { background: #fff !important; border: 3px solid var(--team, #0ea5e9); padding: 3px 8px; line-height: 0; }
  .wk.visitor .title.logo img { height: 34px; max-width: 120px; object-fit: contain; }
  #auditPanel h3 { display: flex; align-items: center; gap: 12px; }
  #auditPanel h3 img { height: 56px; max-width: 150px; object-fit: contain; }
  #auditPanel {
    position: absolute; left: 24px; top: 470px; width: 520px;
    padding: 14px 18px; border-radius: 16px;
    background: rgba(255, 255, 255, .95); border: 4px solid var(--team, #0ea5e9);
    color: #111827; font: 700 27px/1.35 "Be Vietnam Pro", sans-serif;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .35);
    opacity: 0; transform: translateX(-30px); transition: opacity .5s, transform .5s;
  }
  #auditPanel.show { opacity: 1; transform: none; }
  #auditPanel { display: none !important; } /* chỉ hiện đoàn người, không hiện bảng checklist */
  #auditPanel h3 { margin: 0 0 8px; font: 800 30px/1.2 "Be Vietnam Pro", sans-serif; color: var(--team, #0ea5e9); }
  #auditPanel ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  #auditPanel li::before { content: "⬜ "; }
  #auditPanel li.done::before { content: "✅ "; }
  #auditPanel li.now { color: var(--team, #0ea5e9); font-weight: 800; }
  #auditPanel .result { margin-top: 10px; padding: 8px 12px; border-radius: 10px; background: #dcfce7; color: #166534; font-weight: 800; text-align: center; display: none; }
  #auditPanel.done .result { display: block; }
  /* Bảng nhỏ góc phải: tặng quà nào được thưởng gì — màu nổi để người xem dễ thấy */
  #giftGuide {
    position: absolute; right: 24px; bottom: 300px; width: 400px; border-radius: 18px; overflow: hidden;
    background: #fff7ed; border: 4px solid #facc15; color: #111827;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .45);
    font: 800 28px/1.25 "Be Vietnam Pro", sans-serif;
    animation: guideBounce 5s ease-in-out infinite; transform-origin: 50% 100%;
  }
  #giftGuide h4 {
    margin: 0; padding: 6px 12px; text-align: center; color: #fff; font: 800 26px/1.3 "Be Vietnam Pro", sans-serif;
    background: linear-gradient(90deg, #e11d48, #db2777); letter-spacing: .5px;
  }
  #giftGuide .row { display: grid; grid-template-columns: 54px 1fr; align-items: center; gap: 8px; padding: 6px 12px; }
  #giftGuide .row + .row { border-top: 2px dashed #fdba74; }
  #giftGuide .ic { width: 50px; height: 50px; display: block; }
  #giftGuide .row.big .ic { width: 58px; height: 58px; }
  #giftGuide small { display: block; font: 700 20px/1.2 "Be Vietnam Pro", sans-serif; color: #9a3412; }
  #giftGuide b { display: block; font-size: 30px; }
  #giftGuide .more { padding: 5px 10px 7px; text-align: center; font: 700 20px/1.3 "Be Vietnam Pro", sans-serif; color: #fff; background: #9d174d; }
  #giftGuide .more b { display: inline; font-size: 20px; color: #fde68a; }
  #giftGuide .up { color: #15803d; }
  #giftGuide .star { color: #b91c1c; }
  body.vinh-danh #giftGuide { display: none; } /* chỗ này dành cho bảng vinh danh */
  @keyframes guideBounce { 0%, 84%, 100% { transform: none; } 88% { transform: scale(1.08) rotate(-2deg); } 92% { transform: scale(1.08) rotate(2deg); } 96% { transform: scale(1.04); } }
  #nowPlaying {
    position: absolute; left: 24px; bottom: 300px; max-width: 480px;
    padding: 8px 18px; border-radius: 999px;
    background: rgba(17, 24, 39, .85); color: #fde68a;
    font: 700 28px/1.3 "Be Vietnam Pro", sans-serif;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    opacity: 0; transition: opacity .5s;
  }
  #nowPlaying.show { opacity: 1; }
  /* Pháo hoa chào nhân viên mới */
  .firework { position: absolute; width: 0; height: 0; pointer-events: none; z-index: 20; }
  .firework i {
    position: absolute; width: 8px; height: 8px; border-radius: 50%;
    box-shadow: 0 0 10px 2px currentColor; background: currentColor;
    animation: fw 1.6s cubic-bezier(.1, .7, .3, 1) forwards;
  }
  @keyframes fw {
    0% { transform: translate(0, 0) scale(1.2); opacity: 1; }
    80% { opacity: 1; }
    100% { transform: translate(var(--dx), calc(var(--dy) + 60px)) scale(.4); opacity: 0; }
  }
  /* Bảng chào mừng đoàn khách hàng */
  #auditWelcome {
    position: absolute; left: 50%; top: 640px; width: 900px;
    transform: translateX(-50%) scale(.8); opacity: 0;
    transition: opacity .5s, transform .5s cubic-bezier(.2, .9, .3, 1.3);
    padding: 28px 36px; border-radius: 26px; text-align: center;
    background: linear-gradient(180deg, #fff, #fff7ed); border: 8px solid var(--team, #e00000);
    box-shadow: 0 20px 60px rgba(0, 0, 0, .5); z-index: 30;
  }
  #auditWelcome.show, #greetBoard.show { opacity: 1; transform: translateX(-50%) scale(1); }
  #greetBoard {
    position: absolute; left: 50%; top: 700px; width: 880px;
    transform: translateX(-50%) scale(.8); opacity: 0;
    transition: opacity .5s, transform .5s cubic-bezier(.2, .9, .3, 1.3);
    padding: 30px 36px; border-radius: 26px; text-align: center; z-index: 31;
    background: linear-gradient(180deg, #fffbeb, #fff); border: 8px solid #f59e0b;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
  }
  #greetBoard .av { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 6px solid #f59e0b; margin: 0 auto 12px; display: grid; place-items: center; background: #fde68a; font: 800 64px/1 "Be Vietnam Pro", sans-serif; color: #b45309; }
  #greetBoard .avs { display: flex; justify-content: center; margin-bottom: 12px; }
  #greetBoard .av.small { width: 96px; height: 96px; margin: 0 -12px; border-width: 5px; font-size: 40px; }
  #greetBoard .t2.group { font-size: 40px; }
  #greetBoard .t1 { font: 800 36px/1.2 "Be Vietnam Pro", sans-serif; color: #e00000; }
  #greetBoard .t2 { font: 800 60px/1.15 "Be Vietnam Pro", sans-serif; color: #b45309; margin: 6px 0; overflow-wrap: anywhere; }
  #greetBoard .t3 { font: 700 28px/1.3 "Be Vietnam Pro", sans-serif; color: #1f2937; }
  #auditWelcome img { height: 120px; max-width: 360px; object-fit: contain; margin-bottom: 10px; }
  #auditWelcome .t1 { font: 800 34px/1.25 "Be Vietnam Pro", sans-serif; color: #e00000; letter-spacing: 1px; }
  #auditWelcome .t2 { font: 800 64px/1.15 "Be Vietnam Pro", sans-serif; color: var(--team, #0ea5e9); margin: 6px 0; }
  #auditWelcome .t3 { font: 700 28px/1.3 "Be Vietnam Pro", sans-serif; color: #1f2937; }
  /* Mưa tiền khi sếp tăng lương (nhẹ: ~20 phần tử, chỉ transform) */
  .ambulance { position: absolute; left: -200px; bottom: 420px; font-size: 130px; z-index: 45; pointer-events: none; animation: ambulance 4.5s ease-in-out forwards; }
  .ambulance::after { content: "🚨"; position: absolute; left: 40px; top: -40px; font-size: 50px; animation: siren .4s steps(2) infinite; }
  @keyframes ambulance { 0% { transform: translateX(0) scaleX(-1); } 40%, 55% { transform: translateX(560px) scaleX(-1); } 100% { transform: translateX(1350px) scaleX(-1); } }
  @keyframes siren { 50% { opacity: .2; } }
  .money { position: absolute; top: -80px; font-size: 54px; pointer-events: none; z-index: 40; animation: moneyFall linear forwards; }
  @keyframes moneyFall { to { transform: translateY(2050px) rotate(var(--r)); } }
  #bossBadge {
    position: absolute; left: 24px; bottom: 372px; padding: 10px 20px; border-radius: 12px;
    background: rgba(127, 29, 29, .92); border: 3px solid #facc15; color: #fde68a;
    font: 800 30px/1.3 "Be Vietnam Pro", sans-serif;
    opacity: 0; transform: translateY(20px); transition: opacity .5s, transform .5s;
  }
  #bossBadge.show { opacity: 1; transform: none; }
  .wk.praising .arm.r { animation: pat .45s ease-in-out infinite alternate; }
  @keyframes pat { from { transform: rotate(-70deg); } to { transform: rotate(-95deg); } }
  .wk.praised .face { border-color: #f472b6; box-shadow: 0 0 0 6px rgba(244, 114, 182, .5); }
  .wk.praised::before {
    content: "❤️"; position: absolute; left: 50%; top: -6px; font-size: 34px; z-index: 4;
    animation: heart 1.4s ease-out infinite;
  }
  @keyframes heart { from { transform: translate(-50%, 0) scale(.6); opacity: 1; } to { transform: translate(-50%, -70px) scale(1.2); opacity: 0; } }
  .wk.bye .face { border-color: #22c55e; box-shadow: 0 0 0 6px rgba(34, 197, 94, .45); }
  .wk.bye .arm.r { animation: wave .4s ease-in-out infinite alternate; }
  .wk.speaking .face { border-color: var(--safety); box-shadow: 0 0 0 6px rgba(250, 204, 21, .45); }
  .wk.speaking .arm.r { animation: wave .5s ease-in-out infinite alternate; }
  @keyframes wave { from { transform: rotate(-150deg); } to { transform: rotate(-120deg); } }

  /* Bong bóng bình luận trên đầu */
  .bubble {
    position: absolute; bottom: calc(100% + 12px); left: 50%;
    transform: translateX(-50%);
    width: max-content; max-width: 420px;
    padding: 12px 18px; border-radius: 16px;
    background: var(--paper); border: 3px solid #f59e0b;
    color: var(--ink); font: 500 var(--font)/1.3 "Be Vietnam Pro", sans-serif;
    overflow-wrap: anywhere;
    box-shadow: 0 8px 22px rgba(0, 0, 0, .45);
    animation: pop .35s cubic-bezier(.2, .9, .3, 1.3) both;
  }
  .bubble::after {
    content: ""; position: absolute; top: 100%; left: 50%;
    border: 14px solid transparent; border-top-color: #f59e0b; transform: translateX(-50%);
  }
  .edge-l .bubble { left: 0; transform: none; }
  .edge-l .bubble::after { left: 56px; }
  .edge-r .bubble { left: auto; right: 0; transform: none; }
  .edge-r .bubble::after { left: auto; right: 42px; transform: none; }
  .bubble.leaving { animation: unpop .3s ease-in both; }
  @keyframes pop { from { opacity: 0; scale: .6; } }
  @keyframes unpop { to { opacity: 0; scale: .8; } }
</style>
</head>
<body>

      <div class="row"><svg class="ic" viewBox="0 0 60 60" aria-hidden="true"><path d="M30 30 L30 56" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/><path d="M30 44 C20 38 13 42 12 48 C20 50 26 48 30 44Z" fill="#22c55e"/><path d="M30 40 C40 34 47 38 48 44 C40 46 34 44 30 40Z" fill="#4ade80"/><path d="M17 16 C17 6 43 6 43 16 C43 28 36 33 30 33 C24 33 17 28 17 16Z" fill="#f472b6"/><path d="M17 16 C22 12 28 14 30 20 C26 26 20 26 17 16Z" fill="#ec4899"/><path d="M43 16 C38 12 32 14 30 20 C34 26 40 26 43 16Z" fill="#db2777"/><path d="M24 10 C27 6 33 6 36 10 C33 13 27 13 24 10Z" fill="#fbcfe8"/></svg><div><small>Hoa hồng · 1 xu</small><b class="up">💰 TĂNG LƯƠNG</b></div></div>
      <div class="row big"><svg class="ic" viewBox="0 0 60 60" aria-hidden="true"><path d="M14 46 C6 46 3 52 4 56 C12 57 18 53 20 48Z" fill="#16a34a"/><path d="M46 46 C54 46 57 52 56 56 C48 57 42 53 40 48Z" fill="#22c55e"/><circle cx="30" cy="30" r="24" fill="#ef4444"/><path d="M8 30 C8 16 18 8 30 8 C22 14 18 22 18 30Z" fill="#f87171"/><path d="M52 30 C52 44 42 52 30 52 C38 46 42 38 42 30Z" fill="#dc2626"/><circle cx="30" cy="30" r="16" fill="#f87171"/><path d="M16 32 C18 20 26 16 34 18 C26 20 22 26 22 34Z" fill="#fca5a5"/><circle cx="30" cy="30" r="9" fill="#ef4444"/><path d="M26 30 C26 25 34 25 34 30 C34 34 29 35 28 32 C27 30 30 28 31 30" fill="none" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/></svg><div><small>Rosa · 10 xu</small><b class="star">👑 THĂNG CHỨC</b></div></div>
      <div class="more">🎁 Quà khác cũng tăng lương<br>quà càng to <b>lương càng cao</b> 💸</div>
    </div>
    <div id="honor" class="empty"><h3>🏆 BẢNG VINH DANH</h3><ol id="honorList"></ol></div>
  </div>
</div>

<script type="module">
  import { connectWS, initials } from '/ws-client.js';
  import { createMusicPlayer } from '/music-player.js';

  const $ = (id) => document.getElementById(id);
  if (new URLSearchParams(location.search).has('preview')) document.body.classList.add('preview');
  if (new URLSearchParams(location.search).has('vinh-danh')) document.body.classList.add('vinh-danh');

  const stage = $('stage');
  const screenFrame = $('frame');
  // App TikTok trên điện thoại màn hình dài (~19.5:9) phóng video 9:16 cho đầy màn và cắt ~9% mỗi bên.
  // ?an-toan (mặc định 0.82) hoặc ?an-toan=0.85: thu cả khung lại để mọi thứ nằm trong vùng không bị cắt.
  const safeParam = new URLSearchParams(location.search).get('an-toan');
  const safeScale = safeParam === null ? 1 : Math.min(1, Math.max(0.6, parseFloat(safeParam) || 0.82));
  if (safeScale < 1) document.body.classList.add('an-toan');
  const fit = () => {
    const { clientWidth: w, clientHeight: h } = document.documentElement;
    // Phủ kín khung nguồn (LIVE Studio/OBS), không để viền trống; ?fit=contain để giữ nguyên khung
    const fitMode = new URLSearchParams(location.search).get('fit') === 'contain' ? Math.min : Math.max;
    const s = fitMode(w / 1080, h / 1920) * safeScale;
    screenFrame.style.transform = `translate(${(w - 1080 * s) / 2}px, ${(h - 1920 * s) / 2}px) scale(${s})`;
  };
  new ResizeObserver(fit).observe(document.documentElement);
  // Báo máy chủ kích thước thật đang vẽ (gửi sau khi kết nối, xem hàm reportViewport)
  let reportTimer;
  function reportViewport() {
    clearTimeout(reportTimer);
    reportTimer = setTimeout(() => server?.send({
      type: 'viewport', page: 'nha-may' + (document.body.classList.contains('preview') ? ' (xem trước)' : ''),
      w: document.documentElement.clientWidth, h: document.documentElement.clientHeight, dpr: devicePixelRatio,
    }), 800);
  }
  addEventListener('resize', reportViewport);
  fit();

  // =====================================================================
  //  VẼ NHÀ XƯỞNG VÀ MÁY MÓC (SVG)
  // =====================================================================
  const gear = (cx, cy, r, fill = '#64748b', dur = 2, rev = false) => `
    <g class="spin${rev ? ' rev' : ''}" style="animation-duration:${dur}s">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" stroke="#1f2937" stroke-width="${Math.max(3, r / 5)}" stroke-dasharray="${Math.max(3, r / 4)} ${Math.max(3, r / 5)}"/>
      <path d="M${cx - r * .7} ${cy}H${cx + r * .7}M${cx} ${cy - r * .7}V${cy + r * .7}" stroke="#cbd5e1" stroke-width="${Math.max(2, r / 8)}"/>
      <circle cx="${cx}" cy="${cy}" r="${r * .25}" fill="#e2e8f0"/>
    </g>`;

  // Tấm giấy / tấm carton chạy trên băng tải từ x1 tới x2
  const flow = (x1, x2, y, w, h, fill, dur = 4, count = 3, extra = '') =>
    Array.from({ length: count }, (_, i) => `
      <g class="flow" style="--d:${x2 - x1 - w}px;animation-duration:${dur}s;animation-delay:-${(i * dur) / count}s">
        <rect x="${x1}" y="${y}" width="${w}" height="${h}" rx="2" fill="${fill}" stroke="rgba(0,0,0,.25)"/>${extra.replaceAll('$X', x1).replaceAll('$Y', y)}
      </g>`).join('');

  const plate = (x, y, w, text, color = '#0f3d7a') => `
    <rect x="${x}" y="${y}" width="${w}" height="40" rx="6" fill="${color}" stroke="#facc15" stroke-width="3"/>
    <text x="${x + w / 2}" y="${y + 28}" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-weight="800" font-size="21" fill="#fff">${text}</text>`;

  const lamp = (x, y, color = '#22c55e', delay = 0) =>
    `<circle cx="${x}" cy="${y}" r="7" fill="${color}" class="blink" style="animation-delay:${delay}s"/>`;

  const panel = (x, y) => `
    <rect x="${x}" y="${y}" width="46" height="58" rx="4" fill="#cbd5e1" stroke="#334155" stroke-width="3"/>
    <rect x="${x + 6}" y="${y + 6}" width="34" height="18" fill="#0ea5e9" opacity=".85"/>
    <circle cx="${x + 13}" cy="${y + 38}" r="5" fill="#22c55e"/><circle cx="${x + 33}" cy="${y + 38}" r="5" fill="#ef4444"/>
    <rect x="${x + 8}" y="${y + 48}" width="30" height="5" fill="#64748b"/>`;

  const legs = (x, w, y, h = 26) => `
    <rect x="${x + 8}" y="${y}" width="14" height="${h}" fill="#334155"/>
    <rect x="${x + w - 22}" y="${y}" width="14" height="${h}" fill="#334155"/>`;

  // 1. Máy tạo sóng: cuộn giấy → trục tạo sóng → cầu dẫn → bàn sấy → dao cắt → xếp tấm
  function corrugator(x, y) {
    return `<g transform="translate(${x} ${y})">
      ${plate(0, 0, 300, 'MÁY TẠO SÓNG')}
      <rect x="0" y="220" width="1020" height="16" fill="#334155"/>
      <!-- Cuộn giấy -->
      <g class="spin" style="animation-duration:6s"><circle cx="70" cy="150" r="62" fill="#d6b07a" stroke="#9a6b35" stroke-width="6"/><circle cx="70" cy="150" r="44" fill="none" stroke="#b88a4f" stroke-width="3"/><path d="M70 92 V208" stroke="#9a6b35" stroke-width="3"/></g>
      <circle cx="70" cy="150" r="14" fill="#475569"/>
      <g class="spin" style="animation-duration:7s"><circle cx="190" cy="168" r="48" fill="#e2c48f" stroke="#9a6b35" stroke-width="5"/><path d="M190 120 V216" stroke="#9a6b35" stroke-width="3"/></g>
      <circle cx="190" cy="168" r="12" fill="#475569"/>
      <path d="M70 88 Q160 60 262 92 M190 120 Q230 104 262 112" stroke="#d6b07a" stroke-width="7" fill="none"/>
      <!-- Cụm tạo sóng -->
      <rect x="250" y="64" width="160" height="156" rx="8" fill="#2f6f5a" stroke="#1e4d3e" stroke-width="4"/>
      <path d="M270 64 V30 H330 V64 M300 30 V12" stroke="#94a3b8" stroke-width="10" fill="none"/>
      ${gear(305, 120, 34, '#64748b', 1.2)}${gear(355, 160, 30, '#64748b', 1.2, true)}
      ${panel(358, 74)}
      <!-- Cầu dẫn với lớp sóng -->
      <path d="M410 120 L560 70" stroke="#9a6b35" stroke-width="14"/>
      <path d="M410 112 Q418 104 426 112 T442 112 T458 106 T474 100 T490 94 T506 90 T522 84 T538 80 T554 72" stroke="#e2c48f" stroke-width="5" fill="none"/>
      <!-- Bàn sấy (double backer) -->
      <rect x="560" y="130" width="330" height="56" rx="6" fill="#4b5563"/>
      <rect x="570" y="176" width="310" height="10" fill="#f97316" class="heat"/>
      <rect x="560" y="118" width="330" height="12" fill="#1f2937"/>
      ${flow(560, 890, 100, 90, 16, '#c8975a', 3.2, 4, '<path d="M$X 108 h90" stroke="#9a6b35" stroke-width="2" stroke-dasharray="4 3"/>')}
      ${legs(560, 330, 186, 34)}
      <!-- Dao cắt và xếp tấm -->
      <rect x="890" y="60" width="130" height="160" rx="8" fill="#2f6f5a" stroke="#1e4d3e" stroke-width="4"/>
      <g class="press" style="--d:26px"><rect x="905" y="74" width="100" height="16" fill="#cbd5e1"/></g>
      ${[0, 1, 2, 3, 4, 5].map((i) => `<rect x="912" y="${196 - i * 12}" width="86" height="10" fill="#c8975a" stroke="#9a6b35"/>`).join('')}
      ${lamp(1004, 72, '#22c55e')}${lamp(986, 72, '#facc15', .5)}
    </g>`;
  }

  // Khung máy chung cho hàng máy nhỏ (320×230)
  const frame = (body) => `<rect x="0" y="206" width="320" height="14" fill="#334155"/>${body}`;

  // 2. Máy in offset: 4 đơn vị in C-M-Y-K
  function offset(x, y) {
    const units = ['#06b6d4', '#ec4899', '#facc15', '#111827'];
    return `<g transform="translate(${x} ${y})">${frame(`
      ${plate(0, 0, 320, 'MÁY IN OFFSET')}
      <rect x="0" y="120" width="40" height="86" fill="#94a3b8"/>
      ${[0, 1, 2, 3, 4].map((i) => `<rect x="4" y="${112 - i * 6}" width="34" height="5" fill="#fff" stroke="#cbd5e1"/>`).join('')}
      ${units.map((c, i) => `
        <rect x="${44 + i * 60}" y="60" width="56" height="146" rx="6" fill="#1e3a5f" stroke="#0f2744" stroke-width="3"/>
        <rect x="${44 + i * 60}" y="60" width="56" height="18" rx="6" fill="${c}"/>
        ${gear(72 + i * 60, 160, 20, '#94a3b8', 1.1, i % 2)}`).join('')}
      ${flow(40, 300, 116, 46, 6, '#ffffff', 2.6, 4)}
      ${panel(250, 92)}${lamp(296, 70, '#22c55e')}`)}
    </g>`;
  }

  // 3. Máy cán màng: cuộn màng bóng + trục nhiệt
  function laminator(x, y) {
    return `<g transform="translate(${x} ${y})">${frame(`
      ${plate(0, 0, 320, 'MÁY CÁN MÀNG')}
      <rect x="30" y="100" width="260" height="106" rx="8" fill="#6b7280" stroke="#374151" stroke-width="4"/>
      <defs><linearGradient id="film" x1="0" x2="1"><stop offset="0" stop-color="#e5e7eb"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#9ca3af"/></linearGradient></defs>
      <g class="spin" style="animation-duration:3s"><circle cx="160" cy="76" r="32" fill="url(#film)" stroke="#6b7280" stroke-width="4"/><path d="M160 44 V108" stroke="#9ca3af" stroke-width="3"/></g>
      <path d="M160 108 L160 140" stroke="#f1f5f9" stroke-width="4" opacity=".8"/>
      ${gear(140, 150, 18, '#ef4444', 1)}${gear(180, 150, 18, '#64748b', 1, true)}
      <rect x="120" y="170" width="80" height="6" fill="#f97316" class="heat"/>
      ${flow(0, 320, 142, 60, 8, '#fef3c7', 3, 3, '<rect x="$X" y="$Y" width="14" height="8" fill="#fff" opacity=".9"/>')}
      ${panel(244, 116)}${lamp(52, 116, '#22c55e')}`)}
    </g>`;
  }

  // 4. Máy in flexo: khay mực + trục anilox, in trực tiếp lên tấm carton
  function flexo(x, y) {
    return `<g transform="translate(${x} ${y})">${frame(`
      ${plate(0, 0, 320, 'MÁY IN FLEXO')}
      ${['#2563eb', '#dc2626'].map((c, i) => `
        <rect x="${30 + i * 140}" y="56" width="120" height="150" rx="8" fill="#7f1d1d" stroke="#450a0a" stroke-width="4"/>
        ${gear(70 + i * 140, 110, 24, '#94a3b8', 1.4)}${gear(110 + i * 140, 110, 16, c, 1.4, true)}
        <rect x="${44 + i * 140}" y="170" width="92" height="22" rx="4" fill="${c}" opacity=".85"/>`).join('')}
      ${flow(0, 320, 140, 70, 14, '#c8975a', 3.4, 3, '<rect x="$X" y="$Y" width="22" height="14" fill="#2563eb" opacity=".7"/>')}
      ${lamp(290, 66, '#22c55e')}${lamp(290, 86, '#facc15', .4)}`)}
    </g>`;
  }

  // 5. Máy bồi: dán tờ in lên tấm sóng
  function mounter(x, y) {
    return `<g transform="translate(${x} ${y})">${frame(`
      ${plate(0, 0, 320, 'MÁY BỒI')}
      <rect x="20" y="80" width="90" height="126" fill="#374151" stroke="#1f2937" stroke-width="4"/>
      ${[0, 1, 2, 3].map((i) => `<rect x="30" y="${94 + i * 8}" width="70" height="6" fill="#fff"/>`).join('')}
      ${[0, 1, 2, 3].map((i) => `<rect x="30" y="${150 + i * 10}" width="70" height="8" fill="#c8975a" stroke="#9a6b35"/>`).join('')}
      <rect x="110" y="96" width="190" height="110" rx="8" fill="#4b5563" stroke="#1f2937" stroke-width="4"/>
      ${gear(160, 130, 22, '#fde68a', 1.2)}${gear(160, 176, 22, '#64748b', 1.2, true)}
      ${gear(230, 152, 26, '#94a3b8', 1.6)}
      ${flow(110, 320, 150, 56, 10, '#c8975a', 3, 3, '<rect x="$X" y="146" width="56" height="5" fill="#fff"/>')}
      ${panel(262, 104)}${lamp(122, 108, '#22c55e')}`)}
    </g>`;
  }

  // 6. Máy bế tự động: bàn ép lên xuống cắt hình thùng
  function dieCutter(x, y) {
    return `<g transform="translate(${x} ${y})">${frame(`
      ${plate(0, 0, 320, 'MÁY BẾ TỰ ĐỘNG')}
      <rect x="70" y="52" width="180" height="154" rx="8" fill="#334155" stroke="#0f172a" stroke-width="4"/>
      <rect x="84" y="64" width="152" height="14" fill="#64748b"/>
      <g class="press" style="--d:40px;animation-duration:1.4s">
        <rect x="90" y="78" width="140" height="34" fill="#94a3b8" stroke="#475569" stroke-width="3"/>
        <path d="M100 112 h40 v-10 h40 v10 h40" stroke="#ef4444" stroke-width="3" fill="none"/>
      </g>
      <rect x="84" y="156" width="152" height="12" fill="#1f2937"/>
      ${flow(0, 320, 140, 64, 14, '#c8975a', 2.8, 3, '<path d="M$X 141 m16 0 v14 m16 -14 v14 m16 -14 v14" stroke="#7c4a1e" stroke-width="2"/>')}
      <rect x="0" y="150" width="70" height="56" fill="#475569"/><rect x="250" y="150" width="70" height="56" fill="#475569"/>
      ${panel(262, 70)}${lamp(84, 186, '#ef4444')}${lamp(104, 186, '#22c55e', .5)}`)}
    </g>`;
  }

  // 7. Máy dán tự động: băng tải gấp nắp + phun keo
  function gluer(x, y) {
    return `<g transform="translate(${x} ${y})">${frame(`
      ${plate(0, 0, 320, 'MÁY DÁN TỰ ĐỘNG')}
      <rect x="0" y="146" width="320" height="34" rx="6" fill="#111827"/>
      <path d="M8 163 H312" stroke="#4b5563" stroke-width="4" stroke-dasharray="10 8" class="flow" style="--d:18px;animation-duration:.6s"/>
      <rect x="0" y="180" width="320" height="26" fill="#475569"/>
      <rect x="110" y="60" width="44" height="60" rx="6" fill="#0f766e"/>
      <path d="M132 120 V138" stroke="#e5e7eb" stroke-width="5"/>
      <circle cx="132" cy="142" r="4" fill="#fde68a" class="blink"/>
      <g transform="translate(200 104)"><rect width="70" height="40" fill="#c8975a" stroke="#9a6b35" stroke-width="2"/><rect class="flap" width="70" height="20" fill="#d6a86b" stroke="#9a6b35" stroke-width="2"/></g>
      ${flow(0, 320, 124, 76, 22, '#c8975a', 3.6, 3, '<path d="M$X 130 h76" stroke="#9a6b35" stroke-width="2"/>')}
      ${panel(20, 70)}${lamp(300, 70, '#22c55e')}`)}
    </g>`;
  }

  // Thùng carton 3D nhỏ (khu thành phẩm)
  const box = (x, y, w = 70, h = 50) => `
    <g transform="translate(${x} ${y})">
      <path d="M0 14 L16 0 H${w + 16} L${w} 14Z" fill="#d6a86b" stroke="#9a6b35" stroke-width="2"/>
      <path d="M${w} 14 L${w + 16} 0 V${h - 14} L${w} ${h}Z" fill="#a8763d" stroke="#9a6b35" stroke-width="2"/>
      <rect y="14" width="${w}" height="${h - 14}" fill="#c8975a" stroke="#9a6b35" stroke-width="2"/>
      <rect x="${w / 2 - 6}" y="14" width="12" height="${h - 14}" fill="#e7c48d"/>
    </g>`;

  function finished(y) {
    const stacks = [[760, 4], [880, 5], [990, 3]];
    return `<g>
      ${plate(40, y, 300, 'KHU THÀNH PHẨM', '#166534')}
      <!-- Băng chuyền thùng -->
      <rect x="40" y="${y + 150}" width="640" height="26" rx="8" fill="#1f2937"/>
      ${Array.from({ length: 16 }, (_, i) => `<circle cx="${56 + i * 40}" cy="${y + 163}" r="9" fill="#64748b" class="spin" style="animation-duration:1s"/>`).join('')}
      ${[0, 1, 2, 3].map((i) => `<g class="flow" style="--d:560px;animation-duration:8s;animation-delay:-${i * 2}s">${box(40, y + 100)}</g>`).join('')}
      <!-- Pallet thùng xếp chồng -->
      ${stacks.map(([sx, n]) => `
        <rect x="${sx - 8}" y="${y + 300}" width="100" height="16" fill="#8b5a2b"/>
        ${Array.from({ length: n }, (_, j) => box(sx, y + 250 - j * 50, 70, 50)).join('')}`).join('')}
      <!-- Xe nâng -->
      <g transform="translate(560 ${y + 220})">
        <rect x="0" y="30" width="110" height="60" rx="10" fill="#f59e0b" stroke="#b45309" stroke-width="4"/>
        <path d="M20 30 V-10 H80 V30" stroke="#1f2937" stroke-width="8" fill="none"/>

  function confetti(el) {
    const box = Object.assign(document.createElement('div'), { className: 'confetti' });
    const colors = ['#facc15', '#ef4444', '#22c55e', '#3b82f6', '#ec4899', '#f97316'];
    for (let i = 0; i < 28; i++) {
      const p = document.createElement('i');
      const angle = (Math.PI * 2 * i) / 28;
      const d = rand(90, 190);
      p.style.background = colors[i % colors.length];
      p.style.setProperty('--dx', `${Math.cos(angle) * d}px`);
      p.style.setProperty('--dy', `${Math.sin(angle) * d - 60}px`);
      p.style.setProperty('--r', `${rand(-540, 540)}deg`);
      box.append(p);
    }
    el.append(box);
    setTimeout(() => box.remove(), 2000);
  }

  function onRank(entry, top) {
    const before = rankMap.get(entry.username)?.level ?? 0;
    rankMap.set(entry.username, entry);
    renderHonor(top);
    const w = crew.find((c) => c?.person.username === entry.username);
    if (w) dress(w.el, entry.username);
    if (entry.level > before && entry.promoted !== false) {
      const target = w ?? assign(entry);
      announce(`🎉 Chúc mừng ${entry.nickname || entry.username} thăng chức: ${entry.title}!`);
      if (target) {
        dress(target.el, entry.username);
        target.el.classList.add('promoted');
        confetti(target.el);
        setTimeout(() => target.el.classList.remove('promoted'), 4500);
        lastFollow = 0;
        follow(target);
      }
    }
  }

  function renderHonor(top = []) {
    const medals = ['🥇', '🥈', '🥉', '4', '5'];
    $('honorList').replaceChildren(...top.map((u, i) => {
      const li = document.createElement('li');
      li.append(
        Object.assign(document.createElement('span'), { textContent: medals[i] }),
        Object.assign(document.createElement('span'), { className: 'n', textContent: u.nickname || u.username }),
        Object.assign(document.createElement('span'), { className: `t title lv-${u.level}`, textContent: u.title }),
        Object.assign(document.createElement('span'), { className: 'p', textContent: `${u.points} điểm chăm chỉ` }),
      );
      return li;
    }));
    $('honor').classList.toggle('empty', top.length === 0);
  }

  // Đưa người xem vào một trạm máy; hết chỗ thì thay người im lặng lâu nhất
  function assign(person, { walkIn = false } = {}) {
    if (isOwner(person)) return bossArrive(person);
    if (isOnLeave(person.username)) return null; // đang nghỉ thai sản
    if (jobOf(person.username)) return placeSpecial(person, { walkIn });
    const lead = leadOf(person.username);
    const wish = lead ? null : machineWish[person.username];
    let i = crew.findIndex((c) => c?.person.username === person.username);
    if (i >= 0) {
      crew[i].lastActive = Date.now();
      if (lead && i !== LEAD_SLOT[lead]) moveToLead(crew[i], lead);
      else if (wish && slotMachine(i) !== wish) {
        const j = wishSlot(wish, person.username);
        if (j >= 0) moveToSlot(crew[i], j);
      }
      return crew[crew.findIndex((c) => c?.person.username === person.username)];
    }
    if (lead) {
      // Trưởng máy luôn đứng ở vị trí chính của máy mình
      i = LEAD_SLOT[lead];
      if (crew[i]) clockOut(i);
    } else {
      i = wish ? wishSlot(wish, person.username) : -1;
      if (i < 0) i = crew.findIndex((c, j) => !c && !reservedSlot(j));
    }
    if (i < 0) {
      crew.forEach((c, j) => {
        // Người cấp thấp và im lặng lâu nhất xuống ca trước
        if (speakingNow.has(c.person.username)) return;
        if (leadOf(c.person.username)) return; // trưởng máy không nhường chỗ
        // Ai im lặng lâu nhất xuống ca trước; chức cao được giữ chỗ thêm 1 phút mỗi bậc, nhân viên công ty nhường trước
        const keep = (w) => w.lastActive + (w.person.staff ? -10 * 60000 : levelOf(w.person.username) * 60000);
        const worse = i < 0 || keep(c) < keep(crew[i]);
        if (worse) i = j;
      });
      if (i < 0) return null;
      clockOut(i);
    }
    const st = STATIONS[i];
    const now = performance.now();
    crew[i] = {
      person, st, el: worker(person), lastActive: Date.now(),
      x: st.x, y: st.y, s: st.s, target: st.x, workUntil: now + rand(2000, 8000),
    };
    if (walkIn) {
      // Vào ca: từ cửa → quẹt thẻ ở máy chấm công → đi tới máy của mình
      Object.assign(crew[i], {
        x: DOOR_X, y: DOOR_Y, s: scaleAt(DOOR_Y), pauseUntil: 0,
        arriving: [
          { x: DOOR_X, y: ENTRY_Y },
          { x: CLOCK_STOP_X, y: ENTRY_Y, act: 'clockin' },
          { x: WALK_X, y: ENTRY_Y },
          { x: WALK_X, y: st.y },
          { x: st.x, y: st.y, act: 'station' },
        ],
      });
      crew[i].el.classList.remove('working');
    }
    place(crew[i]);
    return crew[i];
  }

  function place(w) {
    w.el.style.transform = `translate(${w.x - 65}px, ${w.y}px) translateY(-100%) scale(${w.s})`;
    if (!w.el.classList.contains('speaking') && !w.el.classList.contains('bye')) w.el.style.zIndex = String(Math.round(w.y));
    w.el.classList.toggle('edge-l', w.x < 280);
    w.el.classList.toggle('edge-r', w.x > 800);
  }

  // ---------- Bảo vệ / Lao công (sếp điều chuyển từ dashboard) ----------
  const JOB_TITLE = { 'bao-ve': '🛡 Bảo vệ', 'lao-cong': '🧹 Lao công', 'thu-ky': '📝 Thư ký', 'ke-toan': '🧮 Kế toán' };
  const OFFICE_JOB = new Set(['thu-ky', 'ke-toan']); // được lên làm (không phải bị điều xuống)
  let jobs = {};
  const jobOf = (username) => jobs[username] ?? null;
  const specials = new Map(); // username -> { person, el, job, x, y, s, route, pauseUntil, lastActive }

  function placeSpecial(person, { walkIn = false } = {}) {
    const job = jobOf(person.username);
    let sp = specials.get(person.username);
    if (sp) {
      sp.lastActive = Date.now();
      return sp;
    }
    // Đang đứng máy thì rời chỗ ngay tại vị trí đó
    const i = crew.findIndex((c) => c?.person.username === person.username);
    let x = DOOR_X;
    let y = ENTRY_Y;
    if (i >= 0) {
      ({ x, y } = crew[i]);
      crew[i].el.remove();
      crew[i] = null;
    } else if (!walkIn) {
      x = job === 'bao-ve' ? 240 : rand(150, 900);
      y = job === 'bao-ve' ? ENTRY_Y : WALK_ROWS[Math.floor(Math.random() * WALK_ROWS.length)];
    }
    const el = document.createElement('div');
    el.className = `wk special job-${job}`;
    const title = Object.assign(document.createElement('div'), { className: 'title job', textContent: JOB_TITLE[job] });
    el.append(
      Object.assign(document.createElement('div'), { className: 'hat' }),
      avatarEl(person),
      bodySvg(JOB_BODY[job]),
      title,
      Object.assign(document.createElement('div'), { className: 'nm', textContent: person.nickname || person.username }),
    );
    $('crew').append(el);
    sp = { person, el, job, x, y, s: scaleAt(y), route: [], pauseUntil: 0, lastActive: Date.now() };
    specials.set(person.username, sp);
    moveSpecial(sp);
    return sp;
  }

  function moveSpecial(sp) {
    sp.el.style.transform = `translate(${sp.x - 65}px, ${sp.y}px) translateY(-100%) scale(${sp.s})`;
    if (!sp.el.classList.contains('speaking')) sp.el.style.zIndex = String(Math.round(sp.y));
    sp.el.classList.toggle('edge-l', sp.x < 280);
    sp.el.classList.toggle('edge-r', sp.x > 800);
  }

  function removeSpecial(username) {
    const sp = specials.get(username);
    if (!sp) return null;
    specials.delete(username);
    sp.el.remove();
    return sp;
  }

  // Bảo vệ đi tuần quanh cửa; lao công đi khắp lối đi, dừng lại quét dọn
  function stepSpecials(now, dt) {
    for (const sp of [...specials.values()]) {
      const speaking = sp.el.classList.contains('speaking');
      if (!speaking && Date.now() - sp.lastActive > IDLE_MS) {
        // lâu không hoạt động: ra về bằng cửa như công nhân xuống ca
        specials.delete(sp.person.username);
        sp.el.classList.remove('sweeping');
        sp.path = [{ x: WALK_X, y: sp.y }, { x: WALK_X, y: ENTRY_Y }, { x: CLOCK_STOP_X, y: ENTRY_Y, act: 'clock' }, { x: DOOR_X, y: ENTRY_Y }, { x: DOOR_X, y: DOOR_Y, act: 'exit' }];
        sp.pauseUntil = 0;
        leavers.push(sp);
        continue;
      }
      if (speaking || now < sp.pauseUntil) {
        sp.el.classList.remove('walking');
        continue;
      }
      sp.el.classList.remove('sweeping');
      if (!sp.route.length) {
        const target = sp.job === 'bao-ve'
          ? { x: rand(130, 320), y: ENTRY_Y }
          : { x: rand(140, 940), y: WALK_ROWS[Math.floor(Math.random() * WALK_ROWS.length)] };
        sp.route = routeTo({ x: sp.x, y: sp.y }, target);
      }
      const p = sp.route[0];
      const dx = p.x - sp.x;
      const dy = p.y - sp.y;
      const dist = Math.hypot(dx, dy);
      const step = 55 * sp.s * dt;
      sp.el.classList.add('walking');
      if (dist > step) {
        sp.x += (dx / dist) * step;
        sp.y += (dy / dist) * step;
      } else {
        sp.x = p.x;
        sp.y = p.y;
        sp.route.shift();
        if (!sp.route.length) {
          sp.pauseUntil = now + rand(2500, 5000);
          sp.el.classList.remove('walking');
          if (sp.job === 'lao-cong') sp.el.classList.add('sweeping');
        }
      }
      sp.s = scaleAt(sp.y);
      moveSpecial(sp);
    }
  }

  function onJob({ member, job, jobs: all, boss: bossName, reason }) {
    const up = OFFICE_JOB.has(job);
    // lý do bị điều xuống: kêu mệt / kêu cực / mê gái
    const why = { 'mệt': 'kêu mệt', 'cực': 'kêu cực', 'mê gái': 'mê gái', 'ghét sếp': 'dám ghét sếp', 'chủ tịch': 'đòi làm chủ tịch', 'đi nhậu': 'rủ đi nhậu', 'hút máu': 'nói hút máu', 'từ chức': 'đòi từ chức', 'lười': 'lười biếng' }[reason];
    jobs = all ?? jobs;
    const name = member.nickname || member.username;
    const sep = `Sếp ${bossName || ownerName}`;
    if (!job) {
      // về lại xưởng: rời vị trí đặc biệt, vào làm công nhân
      if (removeSpecial(member.username)) assign(member);
      announce(`🏭 ${sep} cho ${name} về lại xưởng làm việc!`);
      return;
    }
    removeSpecial(member.username);
    const w = assign(member);
    const box = $('greetBoard');
    const av = member.avatar
      ? Object.assign(document.createElement('img'), { src: member.avatar, alt: '', referrerPolicy: 'no-referrer' })
      : Object.assign(document.createElement('div'), { textContent: initials(name) });
    av.className = 'av';
    box.replaceChildren(
      av,
      Object.assign(document.createElement('div'), { className: 't1', textContent: up && (reason === 'xin' || reason === 'khen sếp' || reason === 'vợ sếp') ? `👔 ${sep} đồng ý cho` : `${sep} vừa điều chuyển` }),
      Object.assign(document.createElement('div'), { className: 't2', textContent: name }),
      Object.assign(document.createElement('div'), { className: 't3', textContent: up ? `lên làm ${JOB_TITLE[job]}${reason === 'khen sếp' ? ' vì khen sếp đẹp trai 😎' : reason === 'vợ sếp' ? ' vì muốn làm vợ sếp 😳' : ''}! 🎉` : why ? `${why} nên xuống làm ${JOB_TITLE[job]} 😆` : `xuống làm ${JOB_TITLE[job]} 😆` }),
    );
    box.classList.add('show');
    clearTimeout(greetTimer);
    greetTimer = setTimeout(() => box.classList.remove('show'), 3500);
    announce(up ? `👔 ${sep} cho ${name} lên làm ${JOB_TITLE[job]}${reason === 'khen sếp' ? ' vì khen sếp đẹp trai' : reason === 'vợ sếp' ? ' vì muốn làm vợ sếp' : ''}!` : `${sep} vừa điều chuyển ${name} xuống làm ${JOB_TITLE[job]}${why ? ` vì ${why}` : ''}!`);
    if (w) {
      w.el.querySelector('.bubble:not(.leaving)')?.remove();
      const b = Object.assign(document.createElement('div'), { className: 'bubble', textContent: { 'bao-ve': 'Dạ em đi gác cổng ạ 🫡', 'lao-cong': 'Dạ em đi quét xưởng ạ 🧹😅', 'thu-ky': 'Em cảm ơn sếp ạ, em lên văn phòng liền 📝🥰', 'ke-toan': 'Dạ em đi tính lương cho mọi người ạ 🧮💰' }[job] });
      w.el.prepend(b);
      w.el.style.zIndex = '5000';
      setTimeout(() => b.remove(), 3500);
    }
  }

  function showBoard(member, t1, t3) {
    const name = member.nickname || member.username;
    const box = $('greetBoard');
    const av = member.avatar
      ? Object.assign(document.createElement('img'), { src: member.avatar, alt: '', referrerPolicy: 'no-referrer' })
      : Object.assign(document.createElement('div'), { textContent: initials(name) });
    av.className = 'av';
    box.replaceChildren(
      av,
      Object.assign(document.createElement('div'), { className: 't1', textContent: t1 }),
      Object.assign(document.createElement('div'), { className: 't2', textContent: name }),
      Object.assign(document.createElement('div'), { className: 't3', textContent: t3 }),
    );
    box.classList.add('show');
    clearTimeout(greetTimer);
    greetTimer = setTimeout(() => box.classList.remove('show'), 3500);
  }

  function sayOnce(w, text) {
    w.el.querySelector('.bubble:not(.leaving)')?.remove();
    const b = Object.assign(document.createElement('div'), { className: 'bubble', textContent: text });
    w.el.prepend(b);
    w.el.style.zIndex = '5000';
    setTimeout(() => b.remove(), 3500);
  }

  // Nhân viên xin làm máy nào thì về đứng máy đó
  function onMachine({ member, machine, machineWish: all, jobs: allJobs, boss: bossName }) {
    machineWish = all ?? machineWish;
    jobs = allJobs ?? jobs;
    if (!machine) return;
    const sep = `Sếp ${bossName || ownerName}`;
    const name = member.nickname || member.username;
    removeSpecial(member.username);
    const w = assign(member);
    showBoard(member, `🏭 ${sep} đồng ý cho`, `về đứng ${MACHINE_LABEL[machine]}! 💪`);
    announce(`🏭 ${sep} cho ${name} về đứng ${MACHINE_LABEL[machine]}!`);
    if (w) sayOnce(w, `Dạ em qua ${MACHINE_LABEL[machine]} liền ạ 💪`);
  }

  // Hỏi nộp CV: nộp ở Bao bì Tuấn Tú chứ đâu!
  // Xin vào làm / xin việc / nộp CV: cùng một bảng
  function onCV({ member, company }) {
    const name = member.nickname || member.username;
    showBoard(member, '📄 Muốn nộp CV hả', `Nộp ở ${company} chứ đâu! 😎📦`);
    announce(`📄 ${name} muốn nộp CV? Nộp ở ${company} chứ đâu! 😎`);
    fireworks(3);
    const w = assign(member);
    if (w) sayOnce(w, `Dạ em nộp CV vào ${company} ạ 📄🥰`);
  }

  // Xin nghỉ thai sản: sếp duyệt luôn, xe cấp cứu chở đi bệnh viện; nghỉ 5 phút mới quay lại xưởng
  const MATERNITY_MS = 5 * 60 * 1000;
  const onLeave = new Map(); // username -> nghỉ tới lúc nào
  const isOnLeave = (username) => (onLeave.get(username) ?? 0) > Date.now();
  function onMaternity({ member, hospital, boss: bossName }) {
    const sep = `Sếp ${bossName || ownerName}`;
    const name = member.nickname || member.username;
    showBoard(member, `🤰 ${sep} duyệt cho`, `nghỉ thai sản, đi ${hospital} luôn! 🚑👶`);
    announce(`🤰 ${name} xin nghỉ thai sản, ${sep} cho đi ${hospital} luôn! 🚑`);
    removeSpecial(member.username);
    const w = assign(member);
    if (w) sayOnce(w, 'Sếp ơi em đau bụng quá 🤰😭');
    onLeave.set(member.username, Date.now() + MATERNITY_MS);
    const car = Object.assign(document.createElement('div'), { className: 'ambulance', textContent: '🚑' });
    $('hud').append(car);
    setTimeout(() => car.remove(), 4600);
    // xe tới nơi thì người đó rời xưởng
    setTimeout(() => {
      const i = crew.findIndex((c) => c?.person.username === member.username);
      if (i >= 0) clockOut(i);
    }, 2000);
  }

  // Bị đuổi việc: cho xuống làm Công nhân, vẫn ở lại xưởng
  function onFired({ member, reason, jobs: allJobs, boss: bossName }) {
    jobs = allJobs ?? jobs;
    const sep = `Sếp ${bossName || ownerName}`;
    const name = member.nickname || member.username;
    const why = { 'chưa có lương': 'kêu chưa có lương', 'đình công': 'đòi đình công' }[reason] ?? `kêu ${reason || 'linh tinh'}`;
    showBoard(member, `🚪 ${sep} vừa đuổi việc`, `cho xuống làm Công nhân vì ${why} 😤`);
    announce(`🚪 ${sep} vừa đuổi việc ${name}, cho xuống làm Công nhân vì ${why}!`);
    removeSpecial(member.username);
    const w = assign(member);
    if (w) {
      dress(w.el, member.username);
      sayOnce(w, 'Huhu sếp ơi em lỡ lời mà 😭');
    }
  }

  // ---------- Trưởng máy (gán từ dashboard) ----------
  const LEAD_SLOT = { song: 0, offset: 4, canmang: 6, flexo: 8, boi: 10, be: 12, dan: 14, thanhpham: 16 };
  const MACHINE_LABEL = {
    song: 'Máy tạo sóng', offset: 'Máy in offset', canmang: 'Máy cán màng', flexo: 'Máy in flexo',
    boi: 'Máy bồi', be: 'Máy bế tự động', dan: 'Máy dán tự động', thanhpham: 'Khu thành phẩm',
  };
  let machineLeads = {}; // mã máy -> username
  let machineWish = {};  // username -> mã máy nhân viên xin làm
  // Các vị trí đứng của từng máy (theo thứ tự STATIONS)
  const MACHINE_SLOTS = {
    song: [0, 1, 2, 3, 25, 26], offset: [4, 5, 19], canmang: [6, 7, 20], flexo: [8, 9, 21],
    boi: [10, 11, 22], be: [12, 13, 23], dan: [14, 15, 24], thanhpham: [16, 17, 18, 27],
  };
  const slotMachine = (i) => Object.keys(MACHINE_SLOTS).find((k) => MACHINE_SLOTS[k].includes(i)) ?? null;

  // Chỗ cho người xin làm máy mk: chỗ trống trước, không thì mời người cấp thấp nhất ở máy đó xuống ca
  function wishSlot(mk, username) {
    const slots = MACHINE_SLOTS[mk].filter((j) => !reservedSlot(j));
    const free = slots.find((j) => !crew[j]);
    if (free !== undefined) return free;
    let pick = -1;
    for (const j of slots) {
      const c = crew[j];
      if (!c || c.person.username === username || speakingNow.has(c.person.username) || leadOf(c.person.username)) continue;
      if (machineWish[c.person.username] === mk && !c.person.staff) continue; // người cũng xin máy này thì giữ chỗ
      const prio = (w) => (w.person.staff ? -1 : levelOf(w.person.username));
      if (pick < 0 || prio(c) < prio(crew[pick])) pick = j;
    }
    if (pick >= 0) clockOut(pick);
    return pick;
  }
  const leadOf = (username) => Object.keys(machineLeads).find((k) => machineLeads[k] === username) ?? null;
  // Vị trí chính của máy có trưởng máy (đã gán) thì người khác không đứng vào
  const reservedSlot = (j) => Object.entries(LEAD_SLOT).some(([k, slot]) => slot === j && machineLeads[k]);

  function moveToLead(w, mk) {
    moveToSlot(w, LEAD_SLOT[mk]);
  }

  function moveToSlot(w, i) {
    const from = crew.indexOf(w);
    if (crew[i] && crew[i] !== w) clockOut(i);
    if (from >= 0) crew[from] = null;
    crew[i] = w;
    w.st = STATIONS[i];
    w.target = w.st.x;
    w.arriving = [{ x: WALK_X, y: w.y }, { x: WALK_X, y: w.st.y }, { x: w.st.x, y: w.st.y, act: 'station' }];
  }

  function applyLeads(next) {
    const before = machineLeads;
    machineLeads = { ...(next ?? {}) };
    for (const w of crew.filter(Boolean)) {
      const mk = leadOf(w.person.username);
      const was = Object.keys(before).find((k) => before[k] === w.person.username) ?? null;
      if (mk && mk !== was) {
        moveToLead(w, mk);
        w.el.classList.add('promoted');
        confetti(w.el);
        setTimeout(() => w.el.classList.remove('promoted'), 4500);
        announce(`👑 ${w.person.nickname || w.person.username} được bổ nhiệm Trưởng máy ${MACHINE_LABEL[mk]}!`);
      }
      dress(w.el, w.person.username);
    }
  }

  // Cho công nhân ở vị trí i xuống ca (chỗ trống ngay cho người mới)
  function clockOut(i) {
    const w = crew[i];
    crew[i] = null;
    w.el.classList.remove('speaking', 'working');
    w.el.querySelector('.bubble')?.remove();
    if (!w.person.staff) announce(`👋 ${w.person.nickname || w.person.username} đã xuống ca. Hẹn gặp lại!`);
    if (leavers.length >= MAX_LEAVERS) {
      w.el.classList.add('leaving');
      w.el.addEventListener('animationend', () => w.el.remove(), { once: true });
      return;
    }
    w.path = [
      { x: WALK_X, y: w.y },
      { x: WALK_X, y: ENTRY_Y },
      { x: CLOCK_STOP_X, y: ENTRY_Y, act: 'clock' },
      { x: DOOR_X, y: ENTRY_Y },
      { x: DOOR_X, y: DOOR_Y, act: 'exit' },

  // Quẹt thẻ: máy nháy đèn xanh, hiện giờ chấm công; công nhân vẫy tay chào
  function punch(w, text = 'Tạm biệt mọi người! 👋') {
    const t = new Date();
    $('clockText').textContent = `${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}`;
    for (const id of ['clockLed', 'clockBox']) {
      const el = $(id);
      el.classList.remove('scan');
      void el.getBoundingClientRect();
      el.classList.add('scan');
      setTimeout(() => el.classList.remove('scan'), 1600);
    }
    w.el.classList.add('bye');
    w.el.style.zIndex = '5000';
    const bubble = Object.assign(document.createElement('div'), { className: 'bubble', textContent: text });
    w.el.prepend(bubble);
  }

  // Đi vào ca theo các chặng trong w.arriving; tới máy thì bắt đầu làm việc
  const CLOCK_IN_SAYS = ['Vào ca! 💪', 'Chào cả nhà! ☀️', 'Bắt đầu làm việc nào! 🔧', 'Ca mới, năng lượng mới! ⚡'];
  function stepArrival(w, now, dt) {
    if (now < w.pauseUntil) {
      w.el.classList.remove('walking');
      return;
    }
    if (w.el.classList.contains('bye')) {
      w.el.classList.remove('bye');
      w.el.querySelector('.bubble')?.remove();
    }
    const p = w.arriving[0];
    const dx = p.x - w.x;
    const dy = p.y - w.y;
    const dist = Math.hypot(dx, dy);
    const step = 85 * w.s * dt;
    w.el.classList.add('walking');
    if (dist > step) {
      w.x += (dx / dist) * step;
      w.y += (dy / dist) * step;
      w.s = scaleAt(w.y);
      place(w);
      return;
    }
    w.x = p.x;
    w.y = p.y;
    w.arriving.shift();
    if (p.act === 'clockin') {
      w.pauseUntil = now + 2200;
      w.el.classList.remove('walking');
      punch(w, CLOCK_IN_SAYS[Math.floor(Math.random() * CLOCK_IN_SAYS.length)]);
    } else if (p.act === 'station') {
      w.arriving = null;
      w.s = w.st.s;
      w.el.classList.remove('walking');
      w.workUntil = now + rand(2000, 6000);
    }
    place(w);
  }

  function stepLeaver(w, now, dt) {
    if (now < w.pauseUntil) {
      w.el.classList.remove('walking');
      return;
    }
    if (w.el.classList.contains('bye')) {
      w.el.classList.remove('bye');
      w.el.querySelector('.bubble')?.remove();
    }
    const p = w.path[0];
    const dx = p.x - w.x;
    const dy = p.y - w.y;
    const dist = Math.hypot(dx, dy);
    const step = 85 * w.s * dt;
    w.el.classList.add('walking');
    if (dist > step) {
      w.x += (dx / dist) * step;
      w.y += (dy / dist) * step;
      w.s = scaleAt(w.y);
      place(w);
      return;
    }
    w.x = p.x;
    w.y = p.y;
    place(w);
    w.path.shift();
    if (p.act === 'clock') {
      w.pauseUntil = now + 3200;
      w.el.classList.remove('walking');
      punch(w);
    } else if (p.act === 'exit') {
      w.el.remove();
      leavers.splice(leavers.indexOf(w), 1);
    }
  }

  function nextPraiseSpot() {

    list.sort((a, b) => (boss.praised.get(a.person.username) ?? 0) - (boss.praised.get(b.person.username) ?? 0)

    crew.filter((w) => w && !w.arriving).slice(0, 6).forEach((w, k) => setTimeout(() => {
      if (!crew.includes(w)) return;
      w.el.querySelector('.bubble:not(.leaving)')?.remove();
      const b = Object.assign(document.createElement('div'), { className: 'bubble', textContent: lines[k % lines.length] });
      w.el.prepend(b);
      w.el.classList.add('bye');
      w.el.style.zIndex = '5000';
      setTimeout(() => { b.remove(); w.el.classList.remove('bye'); }, 3000);
    }, 1200 + k * 1100));
  }

  // Sếp Toán tự ghé xưởng định kỳ (kể cả khi chủ kênh không xem LIVE), đi khen nhân viên khoảng 3 phút rồi về
  const BOSS_VISIT_EVERY = [6, 10]; // phút, ngẫu nhiên trong khoảng
  let nextBossVisit = performance.now() + 60 * 1000; // lần đầu sau 1 phút
  function maybeBossVisit(now) {
    if (boss || now < nextBossVisit) return;
    nextBossVisit = now + rand(BOSS_VISIT_EVERY[0], BOSS_VISIT_EVERY[1]) * 60 * 1000;
    if (!crew.some(Boolean)) return; // xưởng trống thì thôi
    const b = bossArrive({ username: ownerUser || 'sep-toan', nickname: `Sếp ${ownerName}`, avatar: null, visit: true });
    b.lastActive = Date.now() - BOSS_IDLE_MS + rand(150, 210) * 1000;
  }

  function stepBoss(now, dt) {
    maybeBossVisit(now);
    if (!boss) return;
    if (Date.now() - boss.lastActive > BOSS_IDLE_MS && !boss.el.classList.contains('speaking')) {
      // Ông chủ về: đi ra cửa như công nhân xuống ca
      const b = boss;
      boss = null;
      $('bossBadge').classList.remove('show');
      announce(`👔 Sếp ${ownerName} đã rời xưởng`);
      b.path = [{ x: WALK_X, y: b.y }, { x: WALK_X, y: ENTRY_Y }, { x: CLOCK_STOP_X, y: ENTRY_Y, act: 'clock' }, { x: DOOR_X, y: ENTRY_Y }, { x: DOOR_X, y: DOOR_Y, act: 'exit' }];
      b.pauseUntil = 0;
      leavers.push(b);
      return;
    }
    const speaking = boss.el.classList.contains('speaking');
    if (speaking || now < boss.pauseUntil) {
      boss.el.classList.remove('walking');
      boss.el.classList.toggle('working', !speaking);
      return;
    }
    if (!boss.spot) boss.spot = nextPraiseSpot() ?? BOSS_SPOTS[Math.floor(Math.random() * BOSS_SPOTS.length)];
    if (boss.spot.worker) {
      // Công nhân có thể đã đi lại: đứng cạnh họ
      const w = boss.spot.worker;
      boss.spot.x = w.x + (w.x > 540 ? -95 : 95) * w.s;
      boss.spot.y = w.y + 4;
    }
    const dx = boss.spot.x - boss.x;
    const dy = boss.spot.y - boss.y;
    const dist = Math.hypot(dx, dy);
    const step = 70 * boss.s * dt;
    boss.el.classList.add('walking');
    boss.el.classList.remove('working');
    if (dist > step) {
      boss.x += (dx / dist) * step;
      boss.y += (dy / dist) * step;
    } else {
      boss.x = boss.spot.x;
      boss.y = boss.spot.y;
      const w = boss.spot.worker;
      boss.spot = null;
      if (w && crew.includes(w)) {
        praise(w);
        boss.pauseUntil = now + 4500;
      } else {
        boss.pauseUntil = now + rand(2500, 4500); // dừng lại kiểm tra máy
      }
    }
    boss.s = scaleAt(boss.y) * 1.12;
    place(boss);
  }

    return badge;
  }

  function visitor(team, color, leader) {
    const el = document.createElement('div');
    el.className = `wk visitor walking${leader ? '' : ' member'}`;
    const title = teamBadge(team, color);
    el.append(

  function inviteAudit(team) {
    if (audit?.team === team || auditQueue.includes(team)) return;
    auditQueue.push(team);
    if (!audit) startAudit();

  // Đường đi theo lối đi: cùng hàng thì đi thẳng, khác hàng thì ra lối dọc rồi xuống hàng mới
  function routeTo(from, to) {
    return Math.abs(from.y - to.y) < 5 ? [to] : [{ x: WALK_X, y: from.y }, { x: WALK_X, y: to.y }, to];
  }

  function startAudit() {
    const team = auditQueue.shift();
    if (!team) return;
    const color = teamColor(team);
    // Đoàn đi một hàng theo trưởng đoàn dọc lối đi
    const people = [0, 1, 2, 3].map((i) => ({ el: visitor(team, color, i === 0), x: DOOR_X, y: DOOR_Y, s: scaleAt(DOOR_Y) }));
    const route = [{ x: DOOR_X, y: ENTRY_Y }, { x: WALK_X, y: ENTRY_Y }];
    let cur = route[1];
    AUDIT_STOPS.forEach((st, i) => {
      route.push(...routeTo(cur, { x: st.x, y: st.y }));
      route[route.length - 1] = { ...route[route.length - 1], stop: i };
      cur = st;
    });
    route.push(...routeTo(cur, { x: WALK_X, y: ENTRY_Y }), { x: DOOR_X, y: ENTRY_Y }, { x: DOOR_X, y: DOOR_Y, exit: true });
    audit = { team, color, people, route, trail: [], pauseUntil: 0, nextChat: performance.now() + 5000, stopsLeft: AUDIT_STOPS.length };
    announce(`🤝 Nhiệt liệt chào mừng đoàn khách hàng ${team} đến audit nhà máy Tuấn Tú!`);
    welcomeTeam(team, color);

  // Chào mừng lần lượt: người mới vào phiên LIVE (tự động) và nút 🎉 Chào mừng trên dashboard
  const greetQueue = [];

  // Người vào gần nhau (trong 1,5 giây) được gom chào chung một bảng, tối đa 8 người / bảng
  const GROUP_MAX = 8;
  let gatherTimer = null;
  function queueGreet(m, { urgent = false } = {}) {
    if (greetQueue.some((g) => g.member.username === m.username)) return;
    if (urgent) greetQueue.unshift({ member: m, solo: true });
    else greetQueue.push({ member: m });
    if (greetQueue.length > GROUP_MAX * 3) greetQueue.splice(GROUP_MAX * 3); // quá đông thì bỏ bớt
    if (greeting) return;
    clearTimeout(gatherTimer);
    gatherTimer = setTimeout(nextGreet, urgent ? 0 : 1500);
  }
  function nextGreet() {
    if (!greetQueue.length) {
      greeting = false;
      return;
    }
    greeting = true;
    if (greetQueue[0].solo) {
      greetMember(greetQueue.shift().member);
    } else {
      const batch = [];
      while (greetQueue.length && !greetQueue[0].solo && batch.length < GROUP_MAX) batch.push(greetQueue.shift().member);
      if (batch.length === 1) greetMember(batch[0]);
      else greetGroup(batch);
    }
    setTimeout(nextGreet, 3200);
  }

  // Bảng chào mừng lớn + pháo hoa + công nhân vẫy chào tên công ty
