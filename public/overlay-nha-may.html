  // Mỗi lúc chỉ một người trong đoàn nói, để bong bóng không đè lên nhau
  function say(person, text, ms = 4000) {
    for (const q of audit?.people ?? []) {
      q.el.querySelector('.bubble')?.remove();
      q.sayUntil = 0;
    }
    const bubble = Object.assign(document.createElement('div'), { className: 'bubble', textContent: text });
    person.el.prepend(bubble);
    person.el.style.zIndex = '5000';
    person.sayUntil = performance.now() + ms;
  }
  const auditPraise = () => AUDIT_PRAISES[Math.floor(Math.random() * AUDIT_PRAISES.length)];

  function stepAudit(now, dt) {
    if (!audit) return;
    const [lead] = audit.people;
    for (const p of audit.people) {
      if (p.sayUntil && now > p.sayUntil) {
        p.el.querySelector('.bubble')?.remove();
        p.sayUntil = 0;
      }
    }
    // Vừa đi vừa trò chuyện: thỉnh thoảng một thành viên khen nhà máy
    const someoneTalking = audit.people.some((q) => q.sayUntil > now);
    if (now > audit.nextChat && !someoneTalking && now >= audit.pauseUntil) {
      audit.nextChat = now + rand(7000, 11000);
      say(audit.people[1 + Math.floor(Math.random() * 3)], auditPraise(), 3800);
    }
    let walking = false;
    if (now >= audit.pauseUntil) {
      const p = audit.route[0];
      const dx = p.x - lead.x;
      const dy = p.y - lead.y;
      const dist = Math.hypot(dx, dy);
      const step = 75 * lead.s * dt;
      if (dist > step) {
        lead.x += (dx / dist) * step;
        lead.y += (dy / dist) * step;
        walking = true;
      } else {
        lead.x = p.x;
        lead.y = p.y;
        audit.route.shift();
        if (p.stop != null) {
          // Dừng ở từng máy: trưởng đoàn khen nhà máy
          audit.stopsLeft -= 1;
          say(lead, `${AUDIT_STOPS[p.stop].name}: ${auditPraise()}`, 4500);
          audit.pauseUntil = now + 4800;
          if (audit.stopsLeft === 0) {
            announce(`🏅 Đoàn ${audit.team} hoàn tất audit: ĐẠT! Cảm ơn quý khách hàng!`);
            confetti(lead.el);
          }
        } else if (p.exit) {
          for (const q of audit.people) q.el.remove();
          audit = null;
          startAudit();
          return;
        }
      }
    }
    // Thành viên đi theo vết chân trưởng đoàn (một hàng dọc trên lối đi)
    const last = audit.trail[audit.trail.length - 1];
    if (!last || Math.hypot(last.x - lead.x, last.y - lead.y) > 6) audit.trail.push({ x: lead.x, y: lead.y });
    if (audit.trail.length > 200) audit.trail.shift();
    audit.people.forEach((q, i) => {
      if (i > 0) {
        const t = audit.trail[Math.max(0, audit.trail.length - 1 - i * 11)];
        if (t) { q.x = t.x; q.y = t.y; }
      }
      q.s = scaleAt(q.y);
      q.el.classList.toggle('walking', walking);
      q.el.style.transform = `translate(${q.x - 65}px, ${q.y}px) translateY(-100%) scale(${q.s})`;
      if (!q.sayUntil) q.el.style.zIndex = String(Math.round(q.y) + 1);
    });
  }

  // =====================================================================
  //  MÁY QUAY ẢO: lần lượt zoom vào từng máy, lia tới người vừa bình luận
  // =====================================================================
  // Mỗi góc quay: tâm (x, y) trong nhà máy, độ zoom, tên hiện trên màn hình. Chỉ chạy khi có ?camera=on.
  const shot = (name, x, y, z, hold = 7000) => ({ name, x, y, z, hold });
  const SHOTS = [
    shot('TOÀN CẢNH NHÀ MÁY', 540, 960, 1, 6000),
    shot('MÁY TẠO SÓNG · CUỘN GIẤY & TẠO SÓNG', 290, 520, 2),
    shot('MÁY TẠO SÓNG · SẤY & CẮT TẤM', 790, 520, 2),
    shot('MÁY IN OFFSET', COLS[0] + 160, 900, 2.9),
    shot('MÁY CÁN MÀNG', COLS[1] + 160, 900, 2.9),
    shot('MÁY IN FLEXO', COLS[2] + 160, 900, 2.9),
    shot('MÁY BỒI', COLS[0] + 160, 1240, 2.9),
    shot('MÁY BẾ TỰ ĐỘNG', COLS[1] + 160, 1240, 2.9),
    shot('MÁY DÁN TỰ ĐỘNG', COLS[2] + 160, 1240, 2.9),
    shot('KHU THÀNH PHẨM', 700, 1660, 1.7),
    shot('MÁY CHẤM CÔNG · LỐI RA', 230, 1760, 2.4),
  ];
  // Mặc định khung cảnh tĩnh (toàn nhà máy); thêm ?camera=on để bật máy quay tự zoom từng máy
  const cameraOn = new URLSearchParams(location.search).get('camera') === 'on';
  const cam = { x: 540, y: 960, z: 1 };
  let shotIndex = 0;
  let target = SHOTS[0];
  let nextShotAt = performance.now() + SHOTS[0].hold;
  let followUntil = 0;
  let lastFollow = 0;

  function setShot(s) {
    target = s;
    $('shotName').textContent = s.name;
  }

  // Lia tới công nhân vừa bình luận (tối đa 1 lần / 8 giây để không giật)
  function follow(w) {
    const now = performance.now();
    if (!cameraOn || audit || now - lastFollow < 8000) return;
    lastFollow = now;
    followUntil = now + 6000;
    setShot({ name: `💬 ${w.person.nickname || w.person.username}`, x: w.x, y: w.y - 120, z: 2.6, worker: w });
  }

  function updateCamera(now, dt) {
    if (!cameraOn) return;
    if (followUntil && now >= followUntil) {
      followUntil = 0;
      setShot(SHOTS[shotIndex]);
      nextShotAt = now + 3000;
    }
    if (!followUntil && now >= nextShotAt) {
      shotIndex = (shotIndex + 1) % SHOTS.length;
      setShot(SHOTS[shotIndex]);
      nextShotAt = now + SHOTS[shotIndex].hold;
    }
    if (target.worker) { target.x = target.worker.x; target.y = target.worker.y - 120; }
    // Chuyển cảnh mượt
    const k = Math.min(1, dt * 1.8);
    cam.z += (target.z - cam.z) * k;
    cam.x += (target.x - cam.x) * k;
    cam.y += (target.y - cam.y) * k;
    // Gần tới đích thì dừng hẳn để trình duyệt vẽ lại sắc nét ở độ zoom cuối
    if (Math.abs(target.z - cam.z) < 0.002) cam.z = target.z;
    if (Math.abs(target.x - cam.x) < 0.3) cam.x = target.x;
    if (Math.abs(target.y - cam.y) < 0.3) cam.y = target.y;
    // Không để lộ ngoài nhà máy
    const halfW = 540 / cam.z;
    const halfH = 960 / cam.z;
    const x = Math.min(1080 - halfW, Math.max(halfW, cam.x));
    const y = Math.min(1920 - halfH, Math.max(halfH, cam.y));
    const t = `translate(${Math.round(540 - x * cam.z)}px, ${Math.round(960 - y * cam.z)}px) scale(${cam.z.toFixed(3)})`;
    if (stage.style.transform !== t) stage.style.transform = t;
    const zoomed = cam.z > 1.25;
    $('shotBar').classList.toggle('show', zoomed);
    $('hud').classList.toggle('zoomed', zoomed);
  }

  // ---------- Giả lập 5–10 công nhân khi nhà máy vắng người ----------
  // Lấy từ danh sách nhân viên (data/nhan-su.json) nếu có; chưa có thì ghép tên tiếng Việt ngẫu nhiên (hư cấu)
  let staffList = [];
  let lastStaffFill = 0;
  let staffTarget = 5 + Math.floor(Math.random() * 6);   // 5–10 người
  let staffTargetAt = performance.now();
  const HO = ['Nguyễn', 'Trần', 'Lê', 'Phạm', 'Hoàng', 'Huỳnh', 'Phan', 'Vũ', 'Võ', 'Đặng', 'Bùi', 'Đỗ', 'Hồ', 'Ngô', 'Dương', 'Lý'];
  const DEM = ['Văn', 'Thị', 'Minh', 'Ngọc', 'Thanh', 'Quốc', 'Hữu', 'Thu', 'Đức', 'Kim', 'Bảo', 'Gia'];
  const TEN = ['An', 'Bình', 'Cường', 'Dũng', 'Hà', 'Hải', 'Hạnh', 'Hiếu', 'Hùng', 'Hương', 'Khoa', 'Lan', 'Linh', 'Long', 'Mai', 'Nam', 'Nga', 'Phúc', 'Quân', 'Sơn', 'Tâm', 'Thảo', 'Trang', 'Tuấn', 'Vy', 'Yến'];
  const ROLES = ['Tổ sóng', 'Tổ in', 'Tổ cán màng', 'Tổ bồi', 'Tổ bế', 'Tổ dán', 'Kho', 'QC', 'Bảo trì'];
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const fakePerson = () => ({ name: `${pick(HO)} ${pick(DEM)} ${pick(TEN)}`, role: pick(ROLES) });

  // Tên nhân viên từ 3 chữ trở lên chỉ hiện 2 chữ cuối (vd. "Đoàn Minh Khánh" → "Minh Khánh")
  const shortName = (name) => {
    const words = String(name).trim().split(/\s+/);
    return words.length >= 3 ? words.slice(-2).join(' ') : words.join(' ');
  };

  function fillWithStaff(now) {
    if (now < lastStaffFill) return;
    lastStaffFill = now + rand(3000, 9000); // người đến rải rác, không ùa vào cùng lúc
    if (now - staffTargetAt > 10 * 60 * 1000) {   // 10 phút đổi số người một lần cho tự nhiên
      staffTarget = 5 + Math.floor(Math.random() * 6);
      staffTargetAt = now;
    }
    const people = crew.filter(Boolean);
    if (people.length >= staffTarget || people.length >= crew.length) return;
    const present = new Set(people.map((c) => c.person.username));
    const pool = staffList.length ? staffList.filter((p) => !present.has(`nv:${p.name}`)) : [fakePerson()];
    if (!pool.length) return;
    const p = pool[Math.floor(Math.random() * pool.length)];
    if (present.has(`nv:${p.name}`)) return;
    const w = assign({ username: `nv:${p.name}`, nickname: shortName(p.name), avatar: p.photo || null, staff: true, role: p.role }, { walkIn: true });
    // Ca ngắn 45 giây – 2,5 phút rồi xuống ca: người ra vào liên tục
    if (w) w.lastActive = Date.now() - IDLE_MS + rand(45, 150) * 1000;
  }

  // Vòng lặp: thao tác máy một lúc rồi bước sang vị trí khác quanh máy
  let last = performance.now();
  let lastIdleCheck = 0;
  function tick(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    updateCamera(now, dt);
    stepSpecials(now, dt);
    fillWithStaff(now);
    stepBoss(now, dt);
    stepAudit(now, dt);
    for (const w of [...leavers]) stepLeaver(w, now, dt);
    if (now - lastIdleCheck > 1000) {
      lastIdleCheck = now;
      renderCount();
      crew.forEach((w, i) => {
        if (w && !leadOf(w.person.username) && !speakingNow.has(w.person.username) && Date.now() - w.lastActive > IDLE_MS) clockOut(i);
      });
    }
    for (const w of crew) {
      if (!w) continue;
      if (w.arriving) {
        stepArrival(w, now, dt);
        continue;
      }
      const speaking = w.el.classList.contains('speaking');
      let walking = false;
      if (!speaking && now >= w.workUntil) {
        const step = 40 * w.st.s * dt;
        if (Math.abs(w.target - w.x) <= step) {
          w.x = w.target;
          w.workUntil = now + rand(3000, 9000);
          w.target = w.st.x + rand(-ROAM, ROAM);
        } else {
          w.x += Math.sign(w.target - w.x) * step;
          walking = true;
        }
      }
      w.el.classList.toggle('walking', walking);
      w.el.classList.toggle('working', !walking && !speaking);
      place(w);
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // Công nhân đang ca = người xem thật trên LIVE + người ảo đang có mặt trong xưởng
  function renderCount() {
    const virtual = crew.filter((w) => w?.person.staff).length;
    const real = viewers || crew.filter((w) => w && !w.person.staff).length;
    const text = `👷 Công nhân đang ca: ${real + virtual} (⭐ ${real} chính thức)`;
    if ($('count').textContent !== text) $('count').textContent = text;
  }

  // ---------- Lời chào công nhân mới ----------
  const welcomeQueue = [];
  let welcoming = false;
  // Người xem mới vào phòng = nhân viên mới tới công ty: pháo hoa + lời chào
  let lastFireworks = 0;
  function fireworks(bursts = 5) {
    const colors = ['#facc15', '#ef4444', '#22c55e', '#38bdf8', '#f472b6', '#fb923c', '#a78bfa'];
    for (let b = 0; b < bursts; b++) {
      setTimeout(() => {
        const fw = Object.assign(document.createElement('div'), { className: 'firework' });
        fw.style.left = `${rand(150, 930)}px`;
        fw.style.top = `${rand(480, 1000)}px`;
        const color = colors[Math.floor(Math.random() * colors.length)];
        for (let i = 0; i < 36; i++) {
          const p = document.createElement('i');
          const a = (Math.PI * 2 * i) / 36;
          const d = rand(110, 210);
          p.style.color = i % 3 ? color : colors[(i + b) % colors.length];
          p.style.setProperty('--dx', `${Math.cos(a) * d}px`);
          p.style.setProperty('--dy', `${Math.sin(a) * d}px`);
          fw.append(p);
        }
        $('hud').append(fw);
        setTimeout(() => fw.remove(), 1800);
      }, b * 350);
    }
  }
  function welcome(m) {
    announce(`🎆 Chào mừng nhân viên mới ${m.nickname || m.username} đến Tuấn Tú Packaging!`);
    const now = performance.now();
    if (now - lastFireworks > 4000) { // nhiều người vào liên tục thì không bắn dồn
      lastFireworks = now;
      fireworks();
    }
  }
  function announce(text) {
    welcomeQueue.push(text);
    if (welcomeQueue.length > 4) welcomeQueue.splice(0, welcomeQueue.length - 4);
    if (!welcoming) nextWelcome();
  }
  function nextWelcome() {
    const text = welcomeQueue.shift();
    const el = $('welcome');
    if (!text) {
      welcoming = false;
      el.classList.remove('show');
      return;
    }
    welcoming = true;
    el.textContent = text;
    el.classList.add('show');
    setTimeout(() => {
      el.classList.remove('show');
      setTimeout(nextWelcome, 450);
    }, 2600);
  }

  // ---------- Bình luận thành bong bóng trên đầu công nhân ----------
  function renderComments(showing) {
    const latest = new Map();
    for (const c of showing) latest.set(c.username, c);
    speakingNow = new Set(latest.keys());
    for (const c of latest.values()) {
      const w = assign(c);
      if (!w) continue;
      if (!w.el.classList.contains('speaking')) follow(w);
      w.el.classList.add('speaking');
      w.el.style.zIndex = '5000';
      let bubble = w.el.querySelector('.bubble:not(.leaving)');
      if (bubble?.dataset.id === c.id) continue;
      bubble?.remove();
      bubble = Object.assign(document.createElement('div'), { className: 'bubble', textContent: c.text });
      bubble.dataset.id = c.id;
      w.el.prepend(bubble);
    }
    for (const w of [...crew, boss, ...specials.values()]) {
      if (!w || speakingNow.has(w.person.username)) continue;
      w.el.classList.remove('speaking');
      const bubble = w.el.querySelector('.bubble:not(.leaving)');
      if (bubble) {
        bubble.classList.add('leaving');
        bubble.addEventListener('animationend', () => bubble.remove(), { once: true });
      }
    }
  }

  function setOwner(s) {
    applyLeads(s.machineLeads);
    // ?ong-chu=<username> để thử với một người xem khác
    ownerUser = String(new URLSearchParams(location.search).get('ong-chu') || s.username || '').toLowerCase();
    ownerName = s.ownerName || 'Toán';
  }

  function clearCrew() {
    for (const sp of specials.values()) sp.el.remove();
    specials.clear();
    for (const w of leavers) w.el.remove();
    leavers.length = 0;
    for (const w of crew) w?.el.remove();
    crew.fill(null);
    boss?.el.remove();
    boss = null;
    $('bossBadge').classList.remove('show');
  }

  let musicPlayer;
  const server = connectWS((msg) => {
    musicPlayer?.handle(msg);
    switch (msg.type) {
      case 'hello':
        reportViewport();
        document.documentElement.style.setProperty('--font', `${Math.min(msg.settings.fontSize, 34)}px`);
        setOwner(msg.settings);
        logos = msg.logos ?? {};
        staffList = msg.staff ?? [];
        salaries = msg.salaries ?? {};
        jobs = msg.jobs ?? {};
        machineWish = msg.machineWish ?? {};
        for (const [name, e] of Object.entries(msg.ranks ?? {})) rankMap.set(name, e);
        renderHonor(msg.top);
        clearCrew();
        {
          // Ưu tiên người vừa bình luận, còn chỗ thì thêm người mới vào phòng
          const people = new Map();
          for (const c of (msg.feed ?? []).filter((c) => !c.old && c.filtered !== 'Người dùng bị chặn').reverse()) if (!people.has(c.username)) people.set(c.username, msg.members.find((m) => m.username === c.username) ?? c);
          for (const m of [...msg.members].reverse()) if (!people.has(m.username)) people.set(m.username, m);
          [...people.values()].slice(0, STATIONS.length).reverse().forEach((m) => assign(m));
        }
        total = msg.members.length;
        viewers = msg.viewers;
        renderCount();
        renderComments(msg.showing);
        break;
      case 'member':
        total = msg.total;
        assign(msg.member, { walkIn: msg.isNew });
        renderCount();
        // Người mới vào phiên LIVE: tự động chào mừng bằng bảng lớn + pháo hoa
        // (trừ chủ kênh, và không chào khi sếp Toán đang ở trong xưởng)
        // trong phiên quá 10 người thì máy chủ báo greet = false
        if ((msg.greet ?? msg.isNew) && !isOwner(msg.member) && !boss) queueGreet(msg.member);
        break;
      case 'members':
        total = 0;
        clearCrew();
        renderCount();
        break;
      case 'viewers':
        viewers = msg.viewers;
        renderCount();
        break;
      case 'settings':
        document.documentElement.style.setProperty('--font', `${Math.min(msg.settings.fontSize, 34)}px`);
        setOwner(msg.settings);
        break;
      case 'showing': renderComments(msg.showing); break;
      case 'rank': onRank(msg.entry, msg.top); break;
      case 'audit': inviteAudit(msg.team); break;
      case 'logos': logos = msg.logos; break;
      case 'greet': queueGreet(msg.member, { urgent: true }); break;
      case 'bossPromote': bossPromote(msg); break;
      case 'salary': raiseSalary(msg); break;
      case 'job': onJob(msg); break;
      case 'machine': onMachine(msg); break;
      case 'fired': onFired(msg); break;
      case 'cv': onCV(msg); break;
      // Ai bình luận cũng vào xưởng ngay, kể cả khi bình luận còn đang chờ tới lượt hiện
      case 'present': assign(msg.member); break;
      case 'maternity': onMaternity(msg); break;
      case 'memberUpdate': {
        // Đổi tên hiển thị từ dashboard: cập nhật ngay trên người đang đứng máy
        const w = crew.find((c) => c?.person.username === msg.member.username);
        if (w) {
          w.person.nickname = msg.member.nickname;
          w.el.querySelector('.nm').textContent = msg.member.nickname;
        }
        break;
      }
      case 'staff': {
        staffList = msg.staff;
        const names = new Set(staffList.map((p) => `nv:${p.name}`));
        crew.forEach((w, i) => { if (w?.person.staff && !names.has(w.person.username)) clockOut(i); });
        break;
      }
    }
  });
  musicPlayer = createMusicPlayer(server, {
    onTrack: (track, playing) => {
      $('nowPlaying').textContent = track ? `🎵 ${track.name}` : '';
      $('nowPlaying').classList.toggle('show', Boolean(track && playing));
    },
  });
</script>
</body>
</html>
